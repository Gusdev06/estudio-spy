# Estúdio Spy na VPS. Pré-requisitos e passo a passo em deploy/README.md.
# Pastas no HOST (o Docker do host monta essas pastas nos containers dos pedidos, por isso os caminhos são do host):
#   /srv/estudio/jobs     → pedidos (entrada, saída, histórico)
#   /srv/estudio/app      → este repositório clonado (o recorte fica em /srv/estudio/app/recorte, somente leitura nos pedidos)
name: estudio-spy

services:
  orquestrador:
    image: estudio-spy-orquestrador
    build: { context: .., dockerfile: deploy/Dockerfile.orquestrador }
    restart: unless-stopped
    env_file: [.env]                          # deploy/.env (chaves e tetos); nunca vai pro git
    ports: ["127.0.0.1:4330:4330"]          # o proxy reverso (EasyPanel/Caddy) publica com HTTPS; a 4331 nunca é publicada
    environment:
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ANTHROPIC_API_KEY_PRODUTO: ${ANTHROPIC_API_KEY_PRODUTO}
      WAVESPEED_API_KEY: ${WAVESPEED_API_KEY}
      COOKIE_SECURE: "1"
      JOBS_HOST_DIR: ${JOBS_HOST_DIR:-/srv/estudio/jobs}
      RECORTE_HOST_DIR: ${RECORTE_HOST_DIR:-/srv/estudio/app/recorte}
      AGENTE_CPUS: ${AGENTE_CPUS:-2}
      AGENTE_MEMORIA: ${AGENTE_MEMORIA:-4g}
    volumes:
      - /srv/estudio/jobs:/data/jobs
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [publica, estudio-interno]

  # Só pra construir a imagem dos pedidos (docker compose build agente); não fica rodando.
  agente:
    image: estudio-spy-agente
    build: { context: .., dockerfile: deploy/Dockerfile.agente }
    profiles: ["build"]

networks:
  publica: {}
  estudio-interno:
    name: estudio-interno
    internal: true          # sem saída pra internet: os pedidos só alcançam o orquestrador
