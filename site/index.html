<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio Spy</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#09090b; --painel:#121215; --painel2:#18181c; --borda:rgba(255,255,255,.08); --borda2:rgba(255,255,255,.14); --texto:#f2f2f3; --suave:#8e8e96;
    --acento:#d4ff3a; --acento-sombra:rgba(212,255,58,.18); --cliente:#1d1d22; --erro:#ff7a7a; --aviso:#ffc35a; --raio:18px; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  html,body { margin:0; background:var(--bg); color:var(--texto); font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:-20vh -10vw auto; height:60vh; pointer-events:none; z-index:-1;
    background:radial-gradient(50% 60% at 50% 0%, rgba(212,255,58,.10), transparent 70%); }
  a { color:var(--acento); text-decoration:none; } a:hover { text-decoration:underline; }
  h1,h2,.marca { font-family:"Inter Tight",Inter,sans-serif; letter-spacing:-.02em; }

  /* topo */
  header { position:sticky; top:10px; z-index:5; display:flex; align-items:center; gap:10px; padding:8px 8px 8px 14px; margin:10px auto 0; width:calc(100% - 24px); max-width:900px;
    border-radius:999px; background:rgba(18,18,21,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--borda); box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .btn-novo { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; background:var(--acento); color:#0b0b0b; font-size:13px; font-weight:600; white-space:nowrap; }
  .btn-novo:hover { text-decoration:none; box-shadow:0 6px 22px var(--acento-sombra); }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .marca { display:flex; align-items:center; gap:9px; font-weight:600; font-size:16px; color:var(--texto); margin-right:6px; }
  .marca:hover { text-decoration:none; } .marca i { color:var(--acento); font-style:normal; }
  .logo { width:26px; height:26px; border-radius:8px; background:var(--acento); display:grid; place-items:center; box-shadow:0 0 0 4px var(--acento-sombra); flex:none; }
  .logo svg { width:12px; height:12px; margin-left:2px; }
  .nav { font-size:13px; color:var(--suave); padding:6px 10px; border-radius:999px; } .nav:hover { color:var(--texto); background:var(--painel2); text-decoration:none; }
  .saldo { font-size:13px; } .saldo .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; font-variant-numeric:tabular-nums; border-radius:999px; background:var(--acento-sombra); color:var(--acento); font-weight:600; }
  .saldo a { color:var(--suave); font-weight:400; } .saldo a:hover { color:var(--texto); }
  header .st { margin-left:auto; color:var(--suave); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30vw; }

  main { max-width:880px; margin:0 auto; padding:28px 16px 170px; }
  h1 { font-size:clamp(30px,5vw,46px); line-height:1.05; margin:28px 0 12px; font-weight:600; }
  h1 em { font-style:normal; color:var(--acento); }
  .sub { color:var(--suave); margin:0 0 26px; font-size:16px; max-width:560px; }
  .card { background:linear-gradient(180deg,var(--painel2),var(--painel)); border:1px solid var(--borda); border-radius:var(--raio); padding:22px; }
  .rotulo { display:block; font-size:12px; font-weight:500; color:var(--suave); margin:16px 0 6px; letter-spacing:.02em; }

  input, textarea { width:100%; background:#0c0c0e; color:var(--texto); border:1px solid var(--borda2); border-radius:12px; padding:12px 14px; font:inherit; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus, textarea:focus { border-color:var(--acento); box-shadow:0 0 0 4px var(--acento-sombra); }
  textarea { resize:vertical; min-height:84px; } input::placeholder, textarea::placeholder { color:#5d5d66; }
  button { background:var(--acento); color:#0b0b0b; border:0; border-radius:12px; padding:12px 20px; font:600 15px Inter,system-ui; cursor:pointer; transition:transform .12s, box-shadow .15s, opacity .15s; }
  button:hover:not(:disabled) { box-shadow:0 8px 28px var(--acento-sombra); transform:translateY(-1px); } button:active:not(:disabled) { transform:translateY(0); }
  button:disabled { opacity:.35; cursor:default; } button.sec { background:var(--painel2); color:var(--texto); border:1px solid var(--borda2); }
  .linha { display:flex; gap:12px; align-items:center; margin-top:16px; flex-wrap:wrap; } .cheio { width:100%; }
  .erro { color:var(--erro); } .ok { color:var(--acento); font-size:14px; margin:8px 0; }

  /* login */
  .entrada { position:relative; min-height:calc(100vh - 140px); display:grid; place-items:center; }
  .entrada::before { content:""; position:absolute; inset:-40px -16px; z-index:-1; pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.09) 1px, transparent 1.4px) 0 0/22px 22px;
    -webkit-mask:radial-gradient(closest-side, #000 30%, transparent); mask:radial-gradient(closest-side, #000 30%, transparent); }
  .entrada .card { box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.02) inset; }
  .entrada .card { width:100%; max-width:410px; padding:30px; } .entrada h1 { font-size:30px; margin:18px 0 6px; } .entrada .sub { font-size:14px; margin-bottom:8px; }
  .entrada .logo { width:40px; height:40px; border-radius:12px; } .entrada .logo svg { width:17px; height:17px; }
  .termos { display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--suave); margin-top:14px; line-height:1.5; }
  .termos input { width:16px; height:16px; margin:2px 0 0; accent-color:var(--acento); flex:none; }
  .rodape-login { display:flex; justify-content:space-between; margin-top:18px; font-size:13px; } .rodape-login a { color:var(--suave); } .rodape-login a:hover { color:var(--texto); }

  /* início */
  .passos { display:flex; gap:8px; flex-wrap:wrap; margin:-6px 0 24px; }
  .passo { font-size:13px; color:var(--suave); padding:6px 12px; border:1px solid var(--borda); border-radius:999px; background:var(--painel); }
  .passo b { color:var(--acento); margin-right:6px; font-weight:600; }
  .drop { position:relative; border:1.5px dashed var(--borda2); border-radius:14px; padding:38px 20px; text-align:center; cursor:pointer; color:var(--suave);
    transition:border-color .15s, background .15s; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .drop:hover, .drop.sobre { border-color:var(--acento); background:rgba(212,255,58,.03); }
  .drop .ic { width:46px; height:46px; border-radius:14px; background:var(--painel2); border:1px solid var(--borda2); display:grid; place-items:center; color:var(--acento); }
  .drop b { color:var(--texto); font-weight:500; } .drop small { font-size:12px; }
  .drop.ok { flex-direction:row; text-align:left; padding:14px; border-style:solid; border-color:var(--borda2); }
  .drop.ok video { width:76px; height:110px; object-fit:cover; border-radius:10px; background:#000; flex:none; }
  .drop.bloq { cursor:default; pointer-events:none; }
  .barra { height:4px; border-radius:4px; background:var(--painel2); overflow:hidden; margin-top:14px; } .barra i { display:block; height:100%; width:0; background:var(--acento); transition:width .2s; }
  .secao { display:flex; align-items:baseline; justify-content:space-between; margin:42px 0 12px; } .secao h2 { font-size:18px; margin:0; font-weight:600; } .secao small { color:var(--suave); }
  .jobs { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .job { display:flex; gap:12px; padding:10px; border:1px solid var(--borda); border-radius:14px; background:var(--painel); color:var(--texto); transition:border-color .15s, transform .15s; min-width:0; }
  .job:hover { border-color:var(--borda2); transform:translateY(-1px); text-decoration:none; }
  .job video { width:54px; height:76px; object-fit:cover; border-radius:9px; background:#000; flex:none; pointer-events:none; }
  .job div { min-width:0; display:flex; flex-direction:column; gap:4px; justify-content:center; }
  .job p { margin:0; font-size:14px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .job small { color:var(--suave); font-size:12px; }
  .estado { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--suave); }
  .estado::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--suave); }
  .estado.rodando::before, .estado.novo::before { background:var(--acento); animation:pulso 1.4s infinite; } .estado.esperando::before { background:var(--aviso); }
  .estado.erro::before { background:var(--erro); } .estado.feito::before { background:var(--acento); } .estado.pronto::before { background:var(--acento); }
  @keyframes pulso { 50% { opacity:.25; } }

  /* chat */
  #chat { padding-top:8px; }
  .msg { margin:16px 0; animation:entra .25s ease-out; } @keyframes entra { from { opacity:0; transform:translateY(6px); } }
  .msg.cliente { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .msg.cliente > div:not(.midia) { background:var(--cliente); border:1px solid var(--borda); border-radius:18px 18px 6px 18px; padding:10px 15px; max-width:78%; white-space:pre-wrap; }
  .msg.cliente .midia { justify-content:flex-end; margin:0; } .msg.cliente .midia video { max-height:300px; max-width:200px; }
  .msg.agente { display:flex; gap:12px; align-items:flex-start; }
  .msg.agente > .logo { margin-top:3px; width:28px; height:28px; } .msg.agente > .logo svg { width:11px; height:11px; }
  .msg.agente > .corpo { min-width:0; flex:1; padding-top:2px; } .msg.agente p { margin:0 0 10px; } .msg.agente p:last-child { margin-bottom:0; }
  .msg.agente table { border-collapse:collapse; font-size:14px; } .msg.agente td,.msg.agente th { border:1px solid var(--borda2); padding:5px 9px; }
  .msg.agente code { background:var(--painel2); padding:1px 6px; border-radius:6px; font-size:13px; }
  .ferr { color:var(--suave); font-size:13px; margin:3px 0 3px 6px; } .ferr::before { content:"⚙ "; }
  .ferrs { margin:8px 0 8px 40px; } .ferrs summary { color:var(--suave); font-size:13px; cursor:pointer; }
  .midia { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0; }
  .midia figure { margin:0; display:flex; flex-direction:column; gap:8px; }
  .midia video,.midia img { max-height:460px; max-width:100%; border-radius:14px; border:1px solid var(--borda); background:#000; display:block; }
  .midia figcaption { color:var(--suave); font-size:12px; }
  .sem-previa { display:flex; flex-direction:column; gap:2px; padding:12px 16px; border-radius:14px; border:1px solid var(--borda2); background:var(--painel2); color:var(--texto); font-size:14px; }
  .sem-previa small { color:var(--suave); font-size:12px; } .sem-previa:hover { border-color:var(--acento); text-decoration:none; }
  .baixar { display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:600; padding:8px 12px; border-radius:10px; background:var(--painel2); border:1px solid var(--borda2); color:var(--texto); }
  .baixar:hover { border-color:var(--acento); text-decoration:none; }
  .fim { color:var(--suave); font-size:12px; text-align:center; margin:6px 0 16px; }
  .aviso-erro { margin:14px 0 14px 40px; padding:10px 14px; border-radius:12px; background:rgba(255,122,122,.08); border:1px solid rgba(255,122,122,.25); color:var(--erro); font-size:14px; }
  .aprov { margin:16px 0 16px 40px; padding:18px 20px; border-radius:var(--raio); border:1px solid rgba(212,255,58,.45); background:linear-gradient(180deg,rgba(212,255,58,.08),rgba(212,255,58,.02)); }
  .aprov p { margin:0 0 12px; } .aprov .uso { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px; color:var(--suave); }
  .aprov .uso b { color:var(--texto); } .aprov button { margin-top:4px; }
  .selo { display:inline-flex; align-items:center; gap:8px; margin:12px 0 12px 40px; padding:7px 12px; border-radius:999px; background:var(--acento-sombra); color:var(--acento); font-size:13px; font-weight:600; }
  .entregas { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; margin:16px 0 16px 40px; }
  .andamento { margin:12px 0 12px 40px; } .andamento small { color:var(--suave); display:block; margin-bottom:8px; }
  .andamento .fotos { display:flex; flex-wrap:wrap; gap:8px; } .andamento img { width:96px; height:128px; object-fit:cover; border-radius:12px; border:1px solid var(--borda); background:#000; display:block; animation:revela .6s ease-out both; }
  @keyframes revela { from { opacity:0; filter:blur(12px); transform:scale(1.04); } }
  /* vídeo que ainda vai sair: cartão tracejado no lugar, que vira o vídeo */
  .vaga { aspect-ratio:9/16; max-height:420px; border:1.5px dashed var(--borda2); border-radius:14px; display:grid; place-items:center; align-content:center; gap:10px; color:var(--suave); font-size:13px; background:rgba(255,255,255,.015); }
  .ativo .vaga { animation:vaga 1.6s ease-in-out infinite; } @keyframes vaga { 50% { border-color:rgba(212,255,58,.35); background:rgba(212,255,58,.03); } }
  .vaga .roda { width:22px; height:22px; border-radius:50%; border:2px solid var(--borda2); border-top-color:var(--acento); animation:gira 1s linear infinite; }
  @keyframes gira { to { transform:rotate(360deg); } }
  .entrega.nova { animation:pop .45s cubic-bezier(.34,1.56,.64,1) both; } @keyframes pop { from { opacity:0; transform:scale(.96); } }
  @media (min-width:641px) { .entregas.bento > .entrega:first-child { grid-column:span 2; grid-row:span 2; } .entregas.bento > .entrega:first-child video { max-height:720px; } }
  /* espera */
  .espera { position:relative; overflow:hidden; margin:18px 0 0 40px; padding:22px; border-radius:var(--raio); border:1px solid var(--borda); background:var(--painel); }
  .espera .orbe { position:absolute; width:260px; height:260px; right:-60px; top:-90px; border-radius:50%; filter:blur(60px); opacity:.35; background:var(--cor, #3affd4);
    transition:background-color 1.2s ease; animation:flutua 6s ease-in-out infinite; pointer-events:none; }
  .espera[data-fase="1"] { --cor:#7dff6a; } .espera[data-fase="2"], .espera[data-fase="3"] { --cor:#d4ff3a; }
  @keyframes flutua { 50% { transform:translate(-14px, 10px) scale(1.06); } }
  .espera .topo { position:relative; display:flex; align-items:center; gap:12px; }
  .espera .topo .logo { animation:respira 2.4s ease-in-out infinite; } @keyframes respira { 50% { box-shadow:0 0 0 7px var(--acento-sombra), 0 0 24px rgba(212,255,58,.35); } }
  .espera .frase { display:block; font:600 17px "Inter Tight",Inter; transition:opacity .3s, transform .3s; } .espera .frase.sai { opacity:0; transform:translateY(-4px); }
  .espera .eta { color:var(--suave); font-size:13px; font-variant-numeric:tabular-nums; }
  .espera ol { position:relative; list-style:none; margin:18px 0 0; padding:0; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .espera li { display:flex; flex-direction:column; gap:8px; font-size:12px; color:var(--suave); }
  .espera li::before { content:""; height:4px; border-radius:4px; background:var(--painel2); }
  .espera li.feito { color:var(--texto); } .espera li.feito::before { background:var(--acento); }
  .espera li.ativo { color:var(--texto); } .espera li.ativo::before { background:linear-gradient(90deg, var(--painel2) 0%, var(--acento) 50%, var(--painel2) 100%) 0 0/200% 100%; animation:brilho 1.6s linear infinite; }
  @keyframes brilho { to { background-position:-200% 0; } }
  .espera .dica { position:relative; margin:14px 0 0; color:var(--suave); font-size:12px; }
  .pronto { display:flex; align-items:center; gap:14px; margin:16px 0 16px 40px; padding:16px 18px; border-radius:var(--raio); border:1px solid rgba(212,255,58,.35); background:linear-gradient(180deg,rgba(212,255,58,.08),rgba(212,255,58,.02)); }
  .pronto .check { width:38px; height:38px; border-radius:50%; background:var(--acento); display:grid; place-items:center; flex:none; animation:pop .5s cubic-bezier(.34,1.56,.64,1) both; }
  .pronto b { display:block; font:600 18px "Inter Tight",Inter; animation:sobe .4s .12s ease-out both; } .pronto small { color:var(--suave); animation:sobe .4s .2s ease-out both; display:block; }
  @keyframes sobe { from { opacity:0; transform:translateY(12px); } }
  /* aprovação: segurar pra confirmar */
  .segurar { position:relative; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation; min-width:250px; }
  .segurar .enche { position:absolute; inset:0; background:rgba(255,255,255,.5); transform:scaleX(0); transform-origin:left; transition:transform .2s ease-out; }
  .segurar.segurando .enche { transform:scaleX(1); transition:transform 1.2s linear; } .segurar .rot { position:relative; }
  .aprov .dica { display:block; margin-top:10px; color:var(--suave); font-size:12px; }
  .pensando .logo { width:20px; height:20px; border-radius:6px; box-shadow:none; animation:respira 2.4s ease-in-out infinite; } .pensando .logo svg { width:8px; height:8px; }
  /* 404 */
  .perdido { min-height:60vh; display:grid; place-content:center; text-align:center; gap:6px; }
  .perdido .num { font:700 clamp(96px,22vw,180px)/.9 "Inter Tight",Inter; letter-spacing:-.06em; color:transparent; -webkit-text-stroke:1.5px var(--borda2);
    background:radial-gradient(circle, rgba(212,255,58,.5) 1px, transparent 1.5px) 0 0/6px 6px; -webkit-background-clip:text; background-clip:text; }
  .perdido h2 { margin:10px 0 0; font-size:22px; } .perdido p { color:var(--suave); margin:0 0 18px; }
  .perdido .btn-novo { justify-self:center; padding:10px 18px; font-size:14px; }
  .entrega { min-width:0; } .entrega .selo { margin:0 0 10px; } .entrega .midia { margin:0; } .entrega figure { width:100%; }
  .entrega video { width:100%; max-height:420px; object-fit:contain; }
  .pensando { display:inline-flex; align-items:center; gap:10px; margin:12px 0 0 40px; padding:9px 14px; border-radius:999px; background:var(--painel); border:1px solid var(--borda); color:var(--suave); font-size:13px; }
  .pontos { display:inline-flex; gap:4px; } .pontos i { width:6px; height:6px; border-radius:50%; background:var(--acento); animation:pulo 1.2s infinite; }
  .pontos i:nth-child(2) { animation-delay:.15s; } .pontos i:nth-child(3) { animation-delay:.3s; }
  @keyframes pulo { 0%,60%,100% { opacity:.25; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }
  .compor { position:fixed; left:0; right:0; bottom:0; padding:28px 16px 18px; background:linear-gradient(transparent,var(--bg) 35%); }
  .compor .in { max-width:880px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; padding:8px; border-radius:20px; background:var(--painel2); border:1px solid var(--borda2); box-shadow:0 12px 40px rgba(0,0,0,.45); }
  .compor .in:focus-within { border-color:rgba(212,255,58,.5); }
  .compor textarea { border:0; background:transparent; min-height:44px; max-height:180px; padding:11px 10px; resize:none; box-shadow:none !important; }
  .compor button { width:44px; height:44px; padding:0; border-radius:14px; display:grid; place-items:center; flex:none; }

  /* admin, compra */
  .admin { margin-top:44px; } .admin > small, #pags > small { display:block; color:var(--suave); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin:22px 0 8px; }
  .presente { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--acento-sombra); color:var(--acento); font-weight:600; font-size:13px; }
  .convite-novo { padding:16px; margin-bottom:10px; } .convite-novo .campos { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .convite-novo label { display:flex; flex-direction:column; } .convite-novo .rotulo { margin:0 0 6px; } .convite-novo .nota { flex:1; min-width:180px; }
  .admin .convite-novo input { width:100%; padding:12px 14px; } .admin .convite-novo input[type=number] { width:90px; } .convite-novo select { background:#0c0c0e; color:var(--texto); border:1px solid var(--borda2); border-radius:12px; padding:12px; font:inherit; }
  .convite-novo .campos button { padding:12px 18px; font-size:14px; border-radius:12px; }

  const h = Math.round(m / 60); if (h < 24) return `há ${h} h`; return new Date(t).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' }); };

  const { pacotes, suporte } = await (await fetch('/api/pacotes')).json();
  app.innerHTML = `<h1>Comprar segundos de vídeo</h1><p class="sub">Cada vídeo entregue desconta a duração dele do saldo (mínimo de 30 s por vídeo). Você aprova antes de gastar, e o que sobrar da reserva volta pro saldo.</p>
  <p class="sub"><b>Importante:</b> no pagamento, use o mesmo e-mail da sua conta (${esc(eu.email)}). O saldo cai sozinho em até 1 minuto depois da aprovação.</p>
  <div class="pacotes">${pacotes.length ? pacotes.map((p) => `<a class="pacote" href="${esc(p.link)}" target="_blank" rel="noopener"><b>${esc(p.nome)}</b><span>${esc(p.preco)}</span><small>${fmtS(p.segundos)} de vídeo</small></a>`).join('')

function home() {

  app.innerHTML = `<h1>Mande o criativo.<br><em>Diga a variação.</em></h1>

  let arquivo = null;
  const pega = (f) => { arquivo = f; drop.classList.add('ok'); const url = URL.createObjectURL(f);
    drop.innerHTML = `${f.type.startsWith('video') ? `<video src="${url}" muted playsinline autoplay loop></video>` : `<video poster="${url}"></video>`}
      <div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</b><small>${(f.size/1e6).toFixed(1)} MB · clique pra trocar</small></div>`;
    $('#ir').disabled = false; };
  drop.onclick = () => arq.click(); arq.onchange = () => arq.files[0] && pega(arq.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('sobre'); }; drop.ondragleave = () => drop.classList.remove('sobre');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('sobre'); e.dataTransfer.files[0] && pega(e.dataTransfer.files[0]); };

    $('#ir').disabled = true; $('#info').textContent = 'enviando…'; $('#barra').hidden = false;
    const x = new XMLHttpRequest(); x.open('POST', `/api/jobs?nome=${encodeURIComponent(arquivo.name)}&msg=${encodeURIComponent($('#msg').value)}`);
    x.upload.onprogress = (e) => { if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); $('#barra i').style.width = p + '%'; $('#info').textContent = `enviando… ${p}%`; } };
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch {}
      if (x.status === 401) { eu = null; return login(); }
      if (x.status >= 300) { $('#info').textContent = d.erro || 'Não deu pra enviar.'; $('#ir').disabled = false; $('#barra').hidden = true; return; }
      location.hash = '#/job/' + d.id; };

    x.send(arquivo);

    $('#jobs').innerHTML = `<div class="secao"><h2>Seus pedidos</h2><small>${js.length}</small></div><div class="jobs">` + js.map((j) => {
      const st = j.entregues && j.status !== 'rodando' ? 'pronto' : j.status;
      const rot = st === 'pronto' ? `${j.entregues} pronto${j.entregues === 1 ? '' : 's'}` : ESTADO[j.status];
      const thumb = j.entrada && /\.(mp4|mov|m4v|webm)$/i.test(j.entrada) ? `<video src="/arquivos/${j.id}/${esc(j.entrada)}#t=0.5" preload="metadata" muted playsinline></video>`
        : j.entrada ? `<video poster="/arquivos/${j.id}/${esc(j.entrada)}"></video>` : '';
      return `<a class="job" href="#/job/${j.id}">${thumb}<div><p>${esc(j.primeira || 'Pedido sem descrição')}</p><span class="estado ${st}">${rot}</span>
        <small>${quando(j.t)}</small></div></a>`; }).join('') + '</div>'; });
}

function ligaCopiar(el) { el.querySelectorAll('button[data-copia]').forEach((b) => b.onclick = async () => {
  try { await navigator.clipboard.writeText(b.dataset.copia); } catch { const t = document.createElement('textarea'); t.value = b.dataset.copia; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  const o = b.textContent; b.textContent = 'Copiado ✓'; setTimeout(() => b.textContent = o, 1500); }); }

    <td><span class="estado ${c.estado === 'aberto' ? 'rodando' : c.estado === 'usado' ? 'feito' : 'erro'}">${c.estado}</span>${c.usado ? `<br><small style="color:var(--suave)">${esc(c.usado.email)}</small>` : c.estado === 'aberto' ? `<br><small style="color:var(--suave)">até ${new Date(c.ate).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' })}</small>` : ''}</td>

// Mídia que não carregou: tenta de novo uma vez (o link pode ter expirado) e, se falhar de novo, mostra o nome no lugar de sumir.
function falhouMidia(el) {
  if (!el.dataset.tentou) { el.dataset.tentou = 1; const u = el.getAttribute('src'); setTimeout(() => { el.src = u + (u.includes('?') ? '&' : '?') + 'r=' + Date.now(); }, 800); return; }
  const fig = el.closest('figure'); if (!fig) return;
  const nome = decodeURIComponent(el.getAttribute('src').split('?')[0].split('/').pop());
  fig.innerHTML = `<a class="sem-previa" href="${el.getAttribute('src').split('?')[0]}" target="_blank">▶ ${esc(nome)}<small>abrir o vídeo</small></a>`;
}

// ---------- painel do admin ----------
const ESTADOS = { 'rodando': 'rodando', 'concluído': 'feito', 'parcial': 'esperando', 'sem entrega': 'erro', 'parado': 'esperando', 'conversa': '', 'recusado': 'erro' };
const dataCurta = (t) => t ? new Date(t).toLocaleString('pt-BR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
const minDur = (ms) => ms == null ? '—' : ms < 60e3 ? `${Math.round(ms / 1000)} s` : `${Math.round(ms / 60e3)} min`;
const arq = (id, rel) => `/arquivos/${id}/${encodeURI(rel)}`;
const vidLento = (src, cls = '') => `<video class="${cls}" data-src="${src}#t=0.5" preload="none" muted playsinline></video>`;
let obsVid = null;
function carregaVideos(raiz) {   // só baixa a prévia do vídeo quando ele aparece na tela
  obsVid?.disconnect(); obsVid = new IntersectionObserver((es) => es.forEach((x) => { if (x.isIntersecting) { const v = x.target; v.preload = 'metadata'; v.src = v.dataset.src; obsVid.unobserve(v); } }), { rootMargin: '300px' });
  raiz.querySelectorAll('video[data-src]').forEach((v) => obsVid.observe(v));
}
let P = null;
async function painelGeral(aba) {
  clearInterval(timer); jobAtual = null; geracao++; $('#compor').hidden = true; botaoNovo(true); mostraSaldo(); $('#st').textContent = '';
  if (!P || !app.querySelector('.painel')) app.innerHTML = '<div class="painel"><p class="sub">carregando…</p></div>';
  P = await (await api('/api/admin/painel')).json();
  const sem = Date.now() - 7 * 86400e3, ps = P.pedidos;
  const fechados = ps.filter((p) => ['concluído', 'parcial', 'sem entrega'].includes(p.estado));
  const acerto = fechados.length ? Math.round(ps.filter((p) => p.estado === 'concluído').length / fechados.length * 100) : null;
  const falhas = ps.flatMap((p) => p.falhas.map((f) => ({ ...f, pedido: p.id, dono: p.dono })));
  const vids = ps.reduce((s, p) => s + p.entregues.length, 0);
  const kpi = (rot, val, sub, cls = '') => `<div class="kpi ${cls}"><small>${rot}</small><b>${val}</b><span>${sub}</span></div>`;
  const maxD = Math.max(1, ...P.dias.map((d) => d.videos));
  app.innerHTML = `<div class="painel">
    <div class="painel-topo"><div><h1>Painel</h1><p class="sub">${P.rodando} rodando agora · ${P.fila} na fila · até ${P.max} ao mesmo tempo</p></div><button class="sec" id="atu">Atualizar</button></div>
    <div class="kpis">
      ${kpi('Usuários', P.usuarios.filter((u) => !u.admin).length, `${P.usuarios.filter((u) => !u.admin && Date.parse(u.criado) > sem).length} novos em 7 dias`)}
      ${kpi('Pedidos', ps.length, `${ps.filter((p) => p.ini > sem).length} em 7 dias`)}
      ${kpi('Vídeos entregues', vids, `${P.dias.slice(-7).reduce((s, d) => s + d.videos, 0)} em 7 dias`, 'destaque')}
      ${kpi('Taxa de acerto', acerto == null ? '—' : acerto + '%', `${ps.filter((p) => p.estado === 'concluído').length} de ${fechados.length} pedidos fechados`)}
      ${kpi('Falhas', falhas.length, `${falhas.filter((f) => f.t > sem).length} em 7 dias`, falhas.some((f) => f.t > sem) ? 'alerta' : '')}
      ${kpi('Saldo em aberto', fmtS(P.usuarios.reduce((s, u) => s + (u.saldo || 0), 0)), 'de vídeo nas contas')}
    </div>
    <div class="grafico card"><div class="g-topo"><small>Vídeos entregues por dia</small><small>14 dias</small></div><div class="barras">${P.dias.map((d) =>
      `<div class="barra-d" title="${d.dia}: ${d.videos} vídeo(s), ${d.pedidos} pedido(s)"><span style="height:${d.videos / maxD * 100}%">${d.videos || ''}</span><i>${d.dia.slice(8)}</i></div>`).join('')}</div></div>
    <nav class="abas">${[['usuarios', 'Usuários'], ['pedidos', 'Pedidos'], ['videos', 'Vídeos'], ['falhas', `Falhas${falhas.length ? ` <em>${falhas.length}</em>` : ''}`], ['convites', 'Convites e créditos']]
      .map(([k, r]) => `<a href="#/admin/${k}" class="${aba === k ? 'on' : ''}">${r}</a>`).join('')}</nav>
    <div id="aba"></div></div>`;
  $('#atu').onclick = () => painelGeral(aba);
  const el = $('#aba');
  if (aba === 'usuarios') abaUsuarios(el);
  if (aba === 'pedidos') abaPedidos(el, ps);
  if (aba === 'videos') abaVideos(el, ps);
  if (aba === 'falhas') abaFalhas(el, falhas);
  if (aba === 'convites') { el.innerHTML = '<div class="admin" id="admin"></div>'; painelAdmin(); }
  if (aba.startsWith('usuario:')) abaUsuario(el, decodeURIComponent(aba.slice(8)));
}
function abaUsuarios(el) {
  el.innerHTML = `<input id="busca" placeholder="Buscar por e-mail ou convite" style="margin-bottom:12px"><div class="tabela"><table class="clicavel"><thead><tr><th>usuário</th><th>saldo</th><th>pedidos</th><th>entregues</th><th>acertos</th><th>falhas</th><th>último uso</th></tr></thead><tbody></tbody></table></div>`;
  const pinta = (q = '') => { el.querySelector('tbody').innerHTML = P.usuarios.filter((u) => (u.email + ' ' + (u.convite || '')).toLowerCase().includes(q.toLowerCase())).map((u) =>
    `<tr data-u="${esc(u.email)}"><td><b>${esc(u.email)}</b>${u.admin ? ' <span class="tag">admin</span>' : ''}<br><small>${u.convite ? '🎁 ' + esc(u.convite) + ' · ' : ''}desde ${dataCurta(Date.parse(u.criado))}</small></td>
     <td>${u.admin ? '∞' : u.saldo}</td><td>${u.pedidos}</td><td>${u.entregues}</td><td>${u.concluidos}</td><td>${u.falhas ? `<span class="tag erro">${u.falhas}</span>` : '0'}</td><td>${u.ultimo ? quando(u.ultimo) : '—'}</td></tr>`).join('') || '<tr><td colspan="7">ninguém encontrado</td></tr>';
    el.querySelectorAll('tr[data-u]').forEach((tr) => tr.onclick = () => location.hash = '#/admin/usuario:' + encodeURIComponent(tr.dataset.u)); };
  pinta(); $('#busca').oninput = (e) => pinta(e.target.value);
}
function cartaoPedido(p, comDono = true) {
  const est = `<span class="estado ${ESTADOS[p.estado] || ''}">${p.estado}</span>`;
  const thumb = p.entrada && /\.(mp4|mov|m4v|webm)$/i.test(p.entrada) ? vidLento(arq(p.id, p.entrada), 'mini') : p.entrada ? `<img class="mini" src="${arq(p.id, p.entrada)}" loading="lazy">` : '<div class="mini"></div>';
  return `<div class="ped card">${thumb}<div class="ped-info">
    <div class="ped-l1">${est}${comDono ? `<a href="#/admin/usuario:${encodeURIComponent(p.dono)}" class="dono">${esc(p.dono)}</a>` : ''}<small>${dataCurta(p.ini)}</small></div>
    <p>${esc(p.primeira || 'sem descrição')}</p>
    <div class="ped-l3"><span>${p.entregues.length}${p.reservados ? '/' + p.reservados : ''} entregue${p.entregues.length === 1 ? '' : 's'}</span><span>produção ${minDur(p.dur)}</span>${p.falhas.length ? `<span class="tag erro">${p.falhas.length} falha${p.falhas.length === 1 ? '' : 's'}</span>` : ''}<a href="#/job/${p.id}">abrir chat →</a></div>
    ${p.entregues.length || p.imagens.length ? `<div class="ped-midias">${p.imagens.map((i) => `<img src="${arq(p.id, i)}" loading="lazy">`).join('')}${p.entregues.map((v) => `<a href="${arq(p.id, v)}" target="_blank">${vidLento(arq(p.id, v))}</a>`).join('')}</div>` : ''}
  </div></div>`;
}
function abaPedidos(el, ps, comDono = true) {
  const FILTROS = [['todos', () => true], ['rodando', (p) => p.estado === 'rodando'], ['concluídos', (p) => p.estado === 'concluído'], ['com falha', (p) => p.falhas.length || ['sem entrega', 'parcial'].includes(p.estado)],
    ['parados', (p) => p.estado === 'parado'], ['só conversa', (p) => ['conversa', 'recusado'].includes(p.estado)]];
  el.insertAdjacentHTML('beforeend', `<div class="chips">${FILTROS.map(([n, f], i) => `<button class="chip-f${i ? '' : ' on'}" data-f="${i}">${n} <em>${ps.filter(f).length}</em></button>`).join('')}</div><div class="peds"></div>`);
  const lista = el.querySelector('.peds');
  const pinta = (i) => { const f = FILTROS[i][1]; lista.innerHTML = ps.filter(f).map((p) => cartaoPedido(p, comDono)).join('') || '<p class="sub">Nenhum pedido aqui.</p>'; carregaVideos(lista);
    el.querySelectorAll('.chip-f').forEach((b) => b.classList.toggle('on', +b.dataset.f === i)); };
  el.querySelectorAll('.chip-f').forEach((b) => b.onclick = () => pinta(+b.dataset.f)); pinta(0);
}
function abaVideos(el, ps) {
  const vs = ps.flatMap((p) => p.entregues.map((v) => ({ p, v }))).sort((a, b) => (b.p.ult || 0) - (a.p.ult || 0));
  el.innerHTML = vs.length ? `<div class="galeria">${vs.map(({ p, v }) => `<figure>${vidLento(arq(p.id, v))}<figcaption><b>${esc(p.dono)}</b><small>${dataCurta(p.ult)}</small>
    <span><a href="${arq(p.id, v)}" target="_blank">ver</a> · <a href="${arq(p.id, v)}?baixar">baixar</a> · <a href="#/job/${p.id}">pedido</a></span></figcaption></figure>`).join('')}</div>` : '<p class="sub">Nenhum vídeo entregue ainda.</p>';
  el.querySelectorAll('.galeria video').forEach((v) => { v.controls = true; }); carregaVideos(el);
}
function abaFalhas(el, falhas) {
  const tipos = [...new Set(falhas.map((f) => f.tipo))];
  el.innerHTML = falhas.length ? `<div class="chips">${tipos.map((t) => `<span class="chip-f">${t} <em>${falhas.filter((f) => f.tipo === t).length}</em></span>`).join('')}</div>
    <div class="falhas">${falhas.sort((a, b) => b.t - a.t).map((f) => `<div class="falha card"><div class="f-l1"><span class="tag erro">${esc(f.tipo)}</span><small>${dataCurta(f.t)}</small></div>
      <p>${esc(f.texto || '')}</p><div class="f-l3"><a href="#/admin/usuario:${encodeURIComponent(f.dono)}">${esc(f.dono)}</a><a href="#/job/${f.pedido}">abrir pedido →</a></div></div>`).join('')}</div>`
    : '<p class="sub">Nenhuma falha registrada. 🎉</p>';
}
function abaUsuario(el, email) {
  const u = P.usuarios.find((x) => x.email === email); if (!u) return el.innerHTML = '<p class="sub">Usuário não encontrado.</p>';
  const meus = P.pedidos.filter((p) => p.dono === email);
  el.innerHTML = `<a href="#/admin/usuarios" class="voltar">← todos os usuários</a>
    <div class="usuario card"><div><h2>${esc(email)}</h2><small>${u.convite ? '🎁 convite: ' + esc(u.convite) + ' · ' : ''}conta criada ${dataCurta(Date.parse(u.criado))} · último uso ${u.ultimo ? quando(u.ultimo) : '—'}</small></div>
      <div class="u-nums"><div><b>${u.admin ? '∞' : fmtS(u.saldo)}</b><small>saldo</small></div><div><b>${u.pedidos}</b><small>pedidos</small></div><div><b>${u.entregues}</b><small>vídeos</small></div><div><b>${u.falhas}</b><small>falhas</small></div></div>
      ${u.admin ? '' : `<div class="u-acoes"><input type="number" id="uq" value="60" step="30" aria-label="segundos"><button id="uc">Dar segundos</button><button class="sec" id="ut">Tirar</button><button class="sec" id="us">Link de nova senha</button></div><p id="um" class="ok" style="word-break:break-all"></p>`}</div>
    <div id="upeds"></div>`;
  abaPedidos($('#upeds'), meus, false);
  if (u.admin) return;
  const credita = async (sinal) => { const n = Math.abs(Math.trunc(Number($('#uq').value))); if (!n) return;
    const r = await api('/api/admin/creditar', { method:'POST', body: JSON.stringify({ email, segundos: sinal * n }) }); const d = await r.json();
    if (!r.ok) return $('#um').textContent = d.erro; painelGeral('usuario:' + encodeURIComponent(email)); };
  $('#uc').onclick = () => credita(1); $('#ut').onclick = () => credita(-1);
  $('#us').onclick = async () => { const r = await api('/api/admin/link-senha', { method:'POST', body: JSON.stringify({ email }) }); const d = await r.json();
    $('#um').innerHTML = r.ok ? `Mande pra ${esc(email)} (vale ${d.validade}): <code>${esc(d.link)}</code>` : esc(d.erro); };
}

function midias(id, texto, { legenda = true, baixar = true, vistos = null } = {}) {
  const achados = [...new Set(texto.match(/job\/[\w.\-\/]+\.(mp4|mov|jpg|jpeg|png|webp)/gi) || [])].filter((p) => !vistos || !vistos.has(p));
  if (vistos) achados.forEach((p) => vistos.add(p));
  if (!achados.length) return '';
  return '<div class="midia">' + achados.map((p) => {
    const src = `/arquivos/${id}/${p}`, nome = p.split('/').pop();
    const el = /\.(mp4|mov|m4v|webm)$/i.test(p) ? `<video src="${src}" controls playsinline preload="metadata" onerror="falhouMidia(this)"></video>${baixar ? `<a class="baixar" href="${src}?baixar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg> Baixar</a>` : ''}`
                                       : `<a href="${src}" target="_blank"><img src="${src}" onerror="falhouMidia(this)"></a>`;
    return `<figure>${el}${legenda ? `<figcaption>${esc(nome)}</figcaption>` : ''}</figure>`;
  }).join('') + '</div>';
}

function job(id) {
  clearInterval(timer); jobAtual = id; ultimo = -1; const g = ++geracao; mostraSaldo(); botaoNovo(true); app.innerHTML = '<div id="chat"></div><div id="pens"></div>'; $('#compor').hidden = false; const vistos = new Set(); let concluido = false;
  let prod = null, media = 4 * 60e3, vivo = false, fraseI = 0;   // prod: produção aprovada em curso; vivo: eventos chegando agora (não o histórico)
  const giro = setInterval(() => { if (g !== geracao) return clearInterval(giro); const f = $('#pens .frase'); if (!f) return;
    const lista = FRASES[+$('#pens .espera').dataset.fase]; if (lista.length < 2) return;
    f.classList.add('sai'); setTimeout(() => { fraseI++; f.textContent = lista[fraseI % lista.length]; f.classList.remove('sai'); }, 300); }, 4000);
  const painel = (status) => {
    const pens = $('#pens');
    if (status === 'rodando' && prod && !prod.fim) {
      const fase = prod.entregues >= prod.videos ? 3 : prod.vids > 0 || prod.entregues > 0 ? 2 : prod.imgs > 0 ? 1 : 0;
      let el = pens.querySelector('.espera');
      if (!el) { pens.innerHTML = `<div class="espera"><div class="orbe"></div><div class="topo">${LOGO}<div><b class="frase"></b><span class="eta"></span></div></div>
        <ol>${FASES.map((f) => `<li>${f}</li>`).join('')}</ol><p class="dica">Pode trocar de aba: avisamos aqui quando ficar pronto.</p></div>`; el = pens.querySelector('.espera'); el.dataset.fase = -1; }
      if (+el.dataset.fase !== fase) { el.dataset.fase = fase; fraseI = 0; el.querySelector('.frase').textContent = FRASES[fase][0]; }
      el.querySelectorAll('li').forEach((li, i) => li.className = i < fase ? 'feito' : i === fase ? 'ativo' : '');
      const resta = prod.t0 + media * prod.videos - Date.now();
      el.querySelector('.eta').textContent = (prod.entregues ? `${prod.entregues} de ${prod.videos} pronto${prod.entregues === 1 ? '' : 's'} · ` : '') + (resta > 60e3 ? `faltam ~${minutos(resta)} min` : 'quase lá');
    } else if (status === 'rodando') { if (!pens.querySelector('.pensando')) pens.innerHTML = `<div class="pensando">${LOGO}<span class="pontos"><i></i><i></i><i></i></span></div>`; }
    else pens.innerHTML = '';
    $('#chat').classList.toggle('ativo', status === 'rodando');
  };
  let ferrs = null;
  let puxando = false;
  const puxar = async () => { if (puxando) return; puxando = true; try { await puxar1(); } finally { puxando = false; } };
  const puxar1 = async () => {
    const r = await api(`/api/jobs/${id}/eventos?depois=${ultimo}`); if (g !== geracao) return;   // resposta de uma tela que já foi trocada
    if (!r.ok) { clearInterval(timer); $('#compor').hidden = true; $('#st').textContent = ''; app.innerHTML = '<div class="perdido"><span class="num">404</span><h2>Esse criativo fugiu do radar.</h2><p>O pedido não existe ou não é da sua conta.</p><a class="btn-novo" href="#">Voltar pro início</a></div>'; return; }
    const { status, eventos, media: m } = await r.json(); if (m) media = m; const chat = $('#chat'); const embaixo = innerHeight + scrollY >= document.body.scrollHeight - 80;
    for (const e of eventos) {
      if (e.n <= ultimo) continue;   // nunca desenha o mesmo evento duas vezes
      ultimo = e.n;
      if (e.tipo === 'ferramenta') {
        if (!detalhes()) continue;
        if (!ferrs) { ferrs = document.createElement('details'); ferrs.className = 'ferrs'; ferrs.innerHTML = '<summary>trabalhando…</summary>'; chat.append(ferrs); }
        if (ferrs.ultimo && eu.admin) ferrs.ultimo.insertAdjacentHTML('beforeend', ` <small>${((e.t - ferrs.ultimo.dataset.t) / 1000).toFixed(0)}s</small>`);
        ferrs.insertAdjacentHTML('beforeend', `<div class="ferr" data-t="${e.t}">${esc(eu.admin && e.detalhe ? e.detalhe : e.texto)}</div>`); ferrs.ultimo = ferrs.lastElementChild;
        ferrs.querySelector('summary').textContent = `${ferrs.children.length - 1} passos`;
        continue;
      }
      if (ferrs?.ultimo && eu.admin) ferrs.ultimo.insertAdjacentHTML('beforeend', ` <small>${((e.t - ferrs.ultimo.dataset.t) / 1000).toFixed(0)}s</small>`);
      ferrs = null;
      if (e.tipo === 'cliente' && (e.interno || /^Aprovado: pode produzir/.test(e.texto))) continue;
      if (e.tipo === 'cliente') { const txt = e.texto.replace(/^Mandei o arquivo em \S+\.\s*/, '');
        chat.insertAdjacentHTML('beforeend', `<div class="msg cliente">${midias(id, e.texto.startsWith('Mandei o arquivo em ') ? e.texto.split(/\s/)[4] : '', { legenda: false, baixar: false })}${txt ? `<div>${esc(txt)}</div>` : ''}</div>`); }
      if (e.tipo === 'agente') chat.insertAdjacentHTML('beforeend', `<div class="msg agente">${LOGO}<div class="corpo">${md(semCaminho(e.texto, id))}${midias(id, e.texto, { vistos })}</div></div>`);
      if (e.tipo === 'fim' && e.dur && detalhes()) chat.insertAdjacentHTML('beforeend', `<div class="fim">admin · rodada ${(e.dur / 60000).toFixed(1)} min${e.durModelo <= e.dur ? ` (modelo ${(e.durModelo / 60000).toFixed(1)} · vídeo/ferramentas ${((e.dur - e.durModelo) / 60000).toFixed(1)})` : ''} · ${e.passos} passos</div>`);
      if (e.tipo === 'erro') chat.insertAdjacentHTML('beforeend', `<div class="aviso-erro">${esc(e.texto)}</div>`);
      if (e.tipo === 'aprovacao') chat.insertAdjacentHTML('beforeend', `<div class="aprov" id="ap-${esc(e.id)}"><p>${esc(e.resumo)}</p>
        <div class="uso"><span>Usa até <b>${fmtS(segAp(e))}</b> do seu saldo (${e.videos} vídeo${e.videos === 1 ? '' : 's'})${eu.admin ? '' : ` · você tem <b>${fmtS(eu.segundos)}</b>`}</span>${!eu.admin && eu.segundos < segAp(e) && temPacotes ? '<a href="#/comprar">comprar segundos</a>' : ''}</div>
        <div class="linha"><button class="segurar" data-ap="${esc(e.id)}"><span class="enche"></span><span class="rot">Segure pra gerar ${e.videos === 1 ? 'meu vídeo' : 'minhas variações'}</span></button><small class="aperro erro"></small></div>
        <small class="dica">Fica pronto em ~${minutos(media * e.videos)} min. Desconta a duração real de cada vídeo (mínimo 30 s); a sobra volta pro saldo.</small></div>`);
      if (e.tipo === 'aprovado') { const c = document.getElementById('ap-' + e.ref); const selo = `<div class="selo">${CHECK} Aprovado · ${e.videos} vídeo${e.videos === 1 ? '' : 's'} · ${fmtS(segAp(e))} reservados</div>`;
        if (c) c.outerHTML = selo; else chat.insertAdjacentHTML('beforeend', selo);
        prod = { t0: e.t, videos: e.videos, imgs: 0, vids: 0, entregues: 0, fim: false };
        chat.insertAdjacentHTML('beforeend', `<div class="andamento" hidden><small>Já está saindo:</small><div class="fotos"></div></div><div class="entregas">${
          Array.from({ length: e.videos }, (_, i) => `<div class="vaga"><span class="roda"></span>variação ${i + 1}</div>`).join('')}</div>`); }
      if (e.tipo === 'etapa' && prod) prod.vids++;
      if (e.tipo === 'andamento') { let a = [...chat.querySelectorAll('.andamento')].pop(); if (!a) { chat.insertAdjacentHTML('beforeend', '<div class="andamento"><small>Já está saindo:</small><div class="fotos"></div></div>'); a = chat.lastElementChild; }
        a.hidden = false; const fotos = a.querySelector('.fotos'), src = `/arquivos/${id}/${encodeURI(e.caminho)}`; if (prod) prod.imgs++;
        fotos.insertAdjacentHTML('beforeend', `<a href="${src}" target="_blank"><img src="${src}" style="animation-delay:${(fotos.children.length % 6) * 80}ms" onerror="this.parentNode.remove()"></a>`); }
      if (e.tipo === 'entregue') { let gr = [...chat.querySelectorAll('.entregas')].pop(); if (!gr || !prod) { gr = document.createElement('div'); gr.className = 'entregas'; chat.append(gr); }
        const html = `<div class="entrega${vivo ? ' nova' : ''}"><div class="selo">${CHECK} ${esc(e.caminho.split('/').pop().replace(/\.[^.]+$/, '').replace(/[-_]/g, ' '))}</div>${midias(id, e.caminho, { legenda: false, vistos })}</div>`;
        const vaga = gr.querySelector('.vaga'); if (vaga) vaga.outerHTML = html; else gr.insertAdjacentHTML('beforeend', html);
        gr.classList.toggle('bento', gr.querySelectorAll('.entrega').length >= 3);
        if (prod) { prod.entregues++; if (vivo && prod.entregues < prod.videos) avisar(`✓ ${prod.entregues} de ${prod.videos} pronto`, 'Já dá pra assistir o primeiro vídeo.'); } }
      if (e.tipo === 'finalizado') { chat.querySelectorAll('.vaga').forEach((v) => v.remove()); chat.querySelectorAll('.entregas').forEach((gr) => gr.classList.toggle('bento', gr.querySelectorAll('.entrega').length >= 3));
        if (prod) prod.fim = true;
        chat.insertAdjacentHTML('beforeend', `<div class="pronto"><span class="check">${CHECK.replace('stroke="currentColor"', 'stroke="#0b0b0b"')}</span><div><b>${e.entregues ? (e.entregues === 1 ? 'Seu vídeo está pronto!' : `Prontas! ${e.entregues} variações`) : 'Pedido encerrado'}</b>
          <small>${e.entregues ? 'Assista e baixe aqui em cima.' : 'Nenhum vídeo foi entregue.'}${e.segundosDevolvidos ? ` ${fmtS(e.segundosDevolvidos)} voltaram pro saldo.` : e.devolvidos && e.segundosDevolvidos == null ? ` ${e.devolvidos} vídeo${e.devolvidos === 1 ? '' : 's'} voltou${e.devolvidos === 1 ? '' : 'aram'} pro saldo.` : ''}</small></div></div>`);
        if (vivo && e.entregues) avisar('✓ Pronto · Estúdio Spy', `${e.entregues} vídeo${e.entregues === 1 ? '' : 's'} pronto${e.entregues === 1 ? '' : 's'} pra baixar.`); }
    }
    painel(status); vivo = true;
    if (eventos.some((e) => e.tipo === 'finalizado')) concluido = true; else if (eventos.some((e) => e.tipo === 'aprovado' || e.tipo === 'cliente')) concluido = false;
    $('#st').textContent = (status !== 'rodando' && concluido ? 'concluído' : ESTADO[status]);
    $('#enviar').disabled = status === 'rodando';
    chat.querySelectorAll('button[data-ap]').forEach((b) => { b.disabled = status === 'rodando'; if (b.dataset.pronto) return; b.dataset.pronto = 1;
      const rot = b.querySelector('.rot'), texto = rot.textContent; let t = null;
      const aprovar = async () => { b.classList.remove('segurando'); b.disabled = true; rot.textContent = 'Aprovando…'; destravaAviso();
        const r = await api(`/api/jobs/${id}/aprovar`, { method:'POST', body: JSON.stringify({ id: b.dataset.ap }) });
        const d = await r.json().catch(() => ({})); if (!r.ok) { b.disabled = false; rot.textContent = texto; b.parentNode.querySelector('.aperro').textContent = d.erro || 'Não deu pra aprovar.'; }
        else if (d.segundos != null) { eu.segundos = d.segundos; mostraSaldo(); } };
      const solta = () => { if (!t) return; clearTimeout(t); t = null; b.classList.remove('segurando'); rot.textContent = texto; };
      b.onpointerdown = (ev) => { if (b.disabled || ev.button > 0) return; b.classList.add('segurando'); rot.textContent = 'Continue segurando…'; t = setTimeout(() => { t = null; aprovar(); }, 1200); };
      b.onpointerup = b.onpointerleave = b.onpointercancel = solta; b.oncontextmenu = (ev) => ev.preventDefault();
      b.onclick = (ev) => { if (ev.detail === 0) aprovar(); };   // teclado (Enter/Espaço) aprova direto
    }); 
    if (eventos.some((e) => e.tipo === 'finalizado')) api('/api/eu').then((r) => r.json()).then((d) => { eu = d; mostraSaldo(); });
    if (eventos.length && embaixo) { scrollTo(0, document.body.scrollHeight);
      chat.querySelectorAll('video:not([data-r])').forEach((v) => { v.dataset.r = 1; v.addEventListener('loadedmetadata', () => { if (innerHeight + scrollY >= document.body.scrollHeight - 600) scrollTo(0, document.body.scrollHeight); }, { once: true }); }); }
  };
  puxar(); timer = setInterval(puxar, 1500);
}

$('#enviar').onclick = async () => {
  const t = $('#resp').value.trim(); if (!t || !jobAtual) return;
  $('#enviar').disabled = true; $('#resp').value = ''; $('#resp').style.height = 'auto';
  const r = await api(`/api/jobs/${jobAtual}/mensagem`, { method:'POST', body: JSON.stringify({ texto: t }) });
  if (!r.ok) { const d = await r.json().catch(() => ({})); $('#resp').value = t; alertaErro(d.erro || 'Não deu pra enviar.'); }
};
function alertaErro(t) { const p = document.createElement('p'); p.className = 'erro'; p.textContent = t; $('#chat')?.append(p); }
$('#resp').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#enviar').click(); } };
$('#resp').oninput = () => { const t = $('#resp'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; };
const rota = async () => {
  const ns = location.hash.match(/^#\/senha\/([\w-]+)$/); if (ns) return novaSenha(ns[1]);
  const cv = location.hash.match(/^#\/convite\/([\w-]+)$/); if (cv) return convite(cv[1]);
  if (!eu) { try { eu = await (await api('/api/eu')).json(); } catch { return; } }
  const m = location.hash.match(/^#\/job\/(.+)$/); if (m) return job(m[1]);
  if (location.hash === '#/comprar') return comprar();
  if (location.hash.startsWith('#/admin') && eu.admin) return painelGeral(location.hash.split('/')[2] || 'usuarios');
  home();
};
$('#sair').onclick = async (e) => { e.preventDefault(); await fetch('/api/sair', { method:'POST' }); eu = null; mostraSaldo(); location.hash = ''; login(); };
addEventListener('hashchange', rota); rota();
</script>
