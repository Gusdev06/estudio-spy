<style>

  .estado.rodando::before, .estado.novo::before { background:var(--acento); animation:pulso 1.4s infinite; } .estado.esperando::before { background:var(--aviso); }
  .estado.erro::before { background:var(--erro); } .estado.pronto::before { background:var(--acento); }

  #chat { padding-top:8px; }

  .pontos { display:inline-flex; gap:4px; } .pontos i { width:6px; height:6px; border-radius:50%; background:var(--acento); animation:pulo 1.2s infinite; }
  .pontos i:nth-child(2) { animation-delay:.15s; } .pontos i:nth-child(3) { animation-delay:.3s; }
  @keyframes pulo { 0%,60%,100% { opacity:.25; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }
  .compor { position:fixed; left:0; right:0; bottom:0; padding:28px 16px 18px; background:linear-gradient(transparent,var(--bg) 35%); }
  .compor .in { max-width:880px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; padding:8px; border-radius:20px; background:var(--painel2); border:1px solid var(--borda2); box-shadow:0 12px 40px rgba(0,0,0,.45); }
  .compor .in:focus-within { border-color:rgba(212,255,58,.5); }
  .compor textarea { border:0; background:transparent; min-height:44px; max-height:180px; padding:11px 10px; resize:none; box-shadow:none !important; }
  .compor button { width:44px; height:44px; padding:0; border-radius:14px; display:grid; place-items:center; flex:none; }

  /* admin, compra */
  .admin { margin-top:44px; } .admin > small, #pags > small { display:block; color:var(--suave); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin:22px 0 8px; }
  .admin table { width:100%; border-collapse:collapse; font-size:14px; } .admin td,.admin th { border-top:1px solid var(--borda); padding:9px 6px; text-align:left; }
  .admin th { color:var(--suave); font-weight:500; font-size:12px; } .admin input { width:64px; margin:0; padding:7px 8px; }
  .admin button { padding:7px 11px; font-size:12px; border-radius:9px; } .admin .tabela { overflow-x:auto; border:1px solid var(--borda); border-radius:14px; padding:4px 10px; background:var(--painel); }
  .pacotes { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-top:18px; }
  .pacote { display:flex; flex-direction:column; gap:6px; padding:20px; border:1px solid var(--borda); border-radius:var(--raio); background:var(--painel); color:var(--texto); }
  .pacote:hover { border-color:var(--acento); text-decoration:none; } .pacote span { color:var(--acento); font:600 26px "Inter Tight",Inter; } .pacote small { color:var(--suave); }

  @media (max-width:640px) {

  }

</style>

<header><a href="#" class="marca" id="novo"><span class="logo"><svg viewBox="0 0 12 12"><path d="M2 1.2v9.6L10.4 6z" fill="#0b0b0b"/></svg></span>Estúdio <i>Spy</i></a><span class="saldo" id="saldo"></span><a href="#/comprar" id="comprar" class="nav" hidden>comprar vídeos</a><span class="st" id="st"></span><a href="#" id="sair" class="nav" hidden>sair</a></header>
<main id="app"></main>
<div class="compor" id="compor" hidden><div class="in">
  <textarea id="resp" rows="1" placeholder="Escreva sua mensagem"></textarea><button id="enviar" aria-label="Enviar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b0b0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div></div>
<script>
const $ = (s) => document.querySelector(s); const app = $('#app');
const LOGO = '<span class="logo"><svg viewBox="0 0 12 12"><path d="M2 1.2v9.6L10.4 6z" fill="#0b0b0b"/></svg></span>';
const ICONE_UP = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>';
const ESTADO = { rodando:'trabalhando', esperando:'esperando você', erro:'erro', novo:'começando' };
const quando = (t) => { if (!t) return ''; const m = Math.round((Date.now() - t) / 60000); if (m < 1) return 'agora'; if (m < 60) return `há ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `há ${h} h`; return new Date(t).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' }); };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
// Caminho interno (job/saida/variacao-1.mp4) vira o nome legível ("variacao 1"); o arquivo em si aparece embaixo como vídeo.
const semCaminho = (t) => t.replace(/`?job\/[\w.\-\/]+\/([\w.\-]+)\.(mp4|mov|m4v|webm|jpe?g|png|webp)`?/gi, (_, n) => n.replace(/[-_]/g, ' '));
const md = (t) => DOMPurify.sanitize(marked.parse(t), { FORBID_TAGS: ['style','form','input','iframe','video','audio','img'], FORBID_ATTR: ['style'] });
let timer = null, ultimo = -1, jobAtual = null, eu = null;
// Admin vê o chat igual ao cliente; "detalhes" liga passos, tempos e custo (lembrado só neste navegador).
let temPacotes = false; fetch('/api/pacotes').then((r) => r.json()).then((d) => { temPacotes = d.pacotes.length > 0; mostraSaldo(); }).catch(() => {});
let det = false; try { det = localStorage.getItem('det') === '1'; } catch {}
const detalhes = () => !!(eu?.admin && det);
function mostraSaldo() {
  const s = $('#saldo'); if (!eu) { s.textContent = ''; $('#comprar').hidden = true; return; }
  $('#comprar').hidden = !!eu.admin || !temPacotes;
  if (!eu.admin) { s.innerHTML = `<span class="chip">${eu.videos} vídeo${eu.videos === 1 ? '' : 's'}</span>`; return; }
  s.innerHTML = `<span class="chip">admin</span> <a href="#" id="det" class="nav">${det ? 'esconder detalhes' : 'ver detalhes'}</a>`;
  $('#det').onclick = (ev) => { ev.preventDefault(); det = !det; try { localStorage.setItem('det', det ? '1' : '0'); } catch {} if (jobAtual) job(jobAtual); else mostraSaldo(); };
}
async function api(url, op) { const r = await fetch(url, op); if (r.status === 401) { eu = null; login(); throw new Error('login'); } return r; }

function login() {
  clearInterval(timer); $('#compor').hidden = true; $('#st').textContent = ''; $('#sair').hidden = true;
  let criar = false;
  app.innerHTML = `<div class="entrada"><div class="card">${LOGO}<h1 id="lt">Bem-vindo de volta</h1><p class="sub" id="ls">Entre pra mandar seus criativos.</p>
  <label class="rotulo" for="em">E-mail</label><input id="em" type="email" placeholder="voce@email.com" autocomplete="email">
  <label class="rotulo" for="se">Senha</label><input id="se" type="password" placeholder="••••••••" autocomplete="current-password">
  <label id="lt2" class="termos" hidden><input type="checkbox" id="aceito"> <span>Li e aceito os <a href="/termos" target="_blank">termos de uso e a política de privacidade</a>.</span></label>
  <div class="linha"><button id="ent" class="cheio">Entrar</button></div>
  <p id="lerro" class="erro" style="font-size:13px;margin:12px 0 0"></p>
  <div class="rodape-login"><a href="#" id="troca">Criar conta</a><a href="#" id="esq">Esqueci a senha</a></div></div></div>`;
  $('#esq').onclick = async (e) => { e.preventDefault(); const em = $('#em').value.trim();
    if (!em) return $('#lerro').textContent = 'Digite o seu e-mail acima e clique de novo em "esqueci a senha".';
    const r = await fetch('/api/esqueci', { method:'POST', body: JSON.stringify({ email: em }) }); const d = await r.json().catch(() => ({}));
    $('#lerro').className = r.ok ? 'ok' : 'erro'; $('#lerro').innerHTML = esc(d.msg || d.erro || 'Tente de novo.') + (d.suporte ? ` <a href="${esc(d.suporte)}" target="_blank">Falar com o suporte</a>` : ''); };
  $('#troca').onclick = (e) => { e.preventDefault(); criar = !criar; $('#lerro').textContent = '';
    $('#lt').textContent = criar ? 'Criar sua conta' : 'Bem-vindo de volta'; $('#ls').textContent = criar ? 'Use uma senha com 8 ou mais caracteres.' : 'Entre pra mandar seus criativos.';
    $('#ent').textContent = criar ? 'Criar conta' : 'Entrar'; $('#troca').textContent = criar ? 'Já tenho conta' : 'Criar conta';
    $('#se').autocomplete = criar ? 'new-password' : 'current-password'; $('#lt2').hidden = !criar; $('#esq').style.visibility = criar ? 'hidden' : 'visible'; };
  const ir = async () => {
    const r = await fetch(criar ? '/api/cadastrar' : '/api/entrar', { method:'POST', body: JSON.stringify({ email: $('#em').value, senha: $('#se').value, termos: criar ? $('#aceito').checked : undefined }) });
    const d = await r.json(); if (!r.ok) return $('#lerro').textContent = d.erro; eu = d; rota();
  };
  $('#ent').onclick = ir; $('#se').onkeydown = (e) => { if (e.key === 'Enter') ir(); };
}

function novaSenha(tok) {
  clearInterval(timer); $('#compor').hidden = true;
  app.innerHTML = `<div class="entrada"><div class="card">${LOGO}<h1>Senha nova</h1><p class="sub">Escolha uma senha com 8 ou mais caracteres.</p>
  <label class="rotulo" for="ns">Senha nova</label><input id="ns" type="password" placeholder="••••••••" autocomplete="new-password">
  <div class="linha"><button id="nsb" class="cheio">Salvar e entrar</button></div><p id="nse" class="erro" style="font-size:13px;margin:12px 0 0"></p></div></div>`;
  $('#nsb').onclick = async () => { const r = await fetch('/api/nova-senha', { method:'POST', body: JSON.stringify({ token: tok, senha: $('#ns').value }) });
    const d = await r.json().catch(() => ({})); if (!r.ok) return $('#nse').textContent = d.erro || 'Não deu certo.'; eu = d; location.hash = ''; };
}

async function comprar() {
  clearInterval(timer); jobAtual = null; $('#compor').hidden = true; mostraSaldo();
  const { pacotes, suporte } = await (await fetch('/api/pacotes')).json();
  app.innerHTML = `<h1>Comprar vídeos</h1><p class="sub">Cada vídeo do saldo = 1 variação pronta entregue. Se um pedido usar menos, a sobra volta pro saldo.</p>
  <p class="sub"><b>Importante:</b> no pagamento, use o mesmo e-mail da sua conta (${esc(eu.email)}). O saldo cai sozinho em até 1 minuto depois da aprovação.</p>
  <div class="pacotes">${pacotes.length ? pacotes.map((p) => `<a class="pacote" href="${esc(p.link)}" target="_blank" rel="noopener"><b>${esc(p.nome)}</b><span>${esc(p.preco)}</span><small>${p.videos} vídeos</small></a>`).join('')
    : '<p class="sub">Os pacotes ainda não estão disponíveis.</p>'}</div>
  ${suporte ? `<p class="sub" style="margin-top:20px">Dúvida ou problema com o pagamento? <a href="${esc(suporte)}" target="_blank">Fale com o suporte</a>.</p>` : ''}
  <p><a href="#">voltar</a></p>`;
}

function home() {
  clearInterval(timer); jobAtual = null; $('#compor').hidden = true; $('#st').textContent = eu.email; $('#sair').hidden = false; mostraSaldo();
  app.innerHTML = `<h1>Mande o criativo.<br><em>Diga a variação.</em></h1>
  <p class="sub">Troca de avatar, headline, layout ou pessoa: do jeito que você pediria pra um editor. As variações chegam prontas pra subir.</p>
  <div class="passos"><span class="passo"><b>1</b>Envie o vídeo</span><span class="passo"><b>2</b>Diga o que variar</span><span class="passo"><b>3</b>Aprove e receba</span></div>
  <div class="card"><div class="drop" id="drop"><span class="ic">${ICONE_UP}</span><b>Arraste o criativo aqui</b><small>ou clique pra escolher · vídeo ou imagem</small></div>
  <input type="file" id="arq" accept="video/*,image/*" hidden>
  <label class="rotulo" for="msg">O que você quer variar? <span style="color:#5d5d66">(opcional)</span></label>
  <textarea id="msg" placeholder="Ex.: 3 variações trocando o avatar por mulheres latinas de 30 anos"></textarea>
  <div class="barra" id="barra" hidden><i></i></div>
  <div class="linha"><button id="ir" disabled>Começar →</button><span id="info" style="color:var(--suave);font-size:13px"></span></div></div>
  <div id="jobs"></div><div class="admin" id="admin"></div>`;
  if (eu.admin) painelAdmin();
  const drop = $('#drop'), arq = $('#arq');
  if (!eu.admin && eu.videos < 1) { drop.classList.add('bloq'); drop.innerHTML = `<span class="ic">${ICONE_UP}</span><b>Você ainda não tem vídeos no saldo</b><small>Fale com quem te passou o acesso.</small>`; $('#msg').disabled = true; }
  let arquivo = null;
  const pega = (f) => { arquivo = f; drop.classList.add('ok'); const url = URL.createObjectURL(f);
    drop.innerHTML = `${f.type.startsWith('video') ? `<video src="${url}" muted playsinline autoplay loop></video>` : `<video poster="${url}"></video>`}
      <div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</b><small>${(f.size/1e6).toFixed(1)} MB · clique pra trocar</small></div>`;
    $('#ir').disabled = false; };
  drop.onclick = () => arq.click(); arq.onchange = () => arq.files[0] && pega(arq.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('sobre'); }; drop.ondragleave = () => drop.classList.remove('sobre');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('sobre'); e.dataTransfer.files[0] && pega(e.dataTransfer.files[0]); };
  $('#ir').onclick = () => {
    $('#ir').disabled = true; $('#info').textContent = 'enviando…'; $('#barra').hidden = false;
    const x = new XMLHttpRequest(); x.open('POST', `/api/jobs?nome=${encodeURIComponent(arquivo.name)}&msg=${encodeURIComponent($('#msg').value)}`);
    x.upload.onprogress = (e) => { if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); $('#barra i').style.width = p + '%'; $('#info').textContent = `enviando… ${p}%`; } };
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch {}
      if (x.status === 401) { eu = null; return login(); }
      if (x.status >= 300) { $('#info').textContent = d.erro || 'Não deu pra enviar.'; $('#ir').disabled = false; $('#barra').hidden = true; return; }
      location.hash = '#/job/' + d.id; };
    x.onerror = () => { $('#info').textContent = 'A conexão caiu. Tente de novo.'; $('#ir').disabled = false; $('#barra').hidden = true; };
    x.send(arquivo);
  };
  api('/api/jobs').then((r) => r.json()).then((js) => { if (!js.length) return;
    $('#jobs').innerHTML = `<div class="secao"><h2>Seus pedidos</h2><small>${js.length}</small></div><div class="jobs">` + js.map((j) => {
      const st = j.entregues && j.status !== 'rodando' ? 'pronto' : j.status;
      const rot = st === 'pronto' ? `${j.entregues} pronto${j.entregues === 1 ? '' : 's'}` : ESTADO[j.status];
      const thumb = j.entrada && /\.(mp4|mov|m4v|webm)$/i.test(j.entrada) ? `<video src="/arquivos/${j.id}/${esc(j.entrada)}#t=0.5" preload="metadata" muted playsinline></video>`
        : j.entrada ? `<video poster="/arquivos/${j.id}/${esc(j.entrada)}"></video>` : '';
      return `<a class="job" href="#/job/${j.id}">${thumb}<div><p>${esc(j.primeira || 'Pedido sem descrição')}</p><span class="estado ${st}">${rot}</span>
        <small>${quando(j.t)}${j.custo != null && detalhes() ? ' · US$ ' + j.custo.toFixed(2) : ''}</small></div></a>`; }).join('') + '</div>'; });
}

async function painelAdmin() {
  const us = await (await api('/api/admin/usuarios')).json();
  $('#admin').innerHTML = `<small>Clientes (admin)</small><div class="tabela"><table><tr><th>e-mail</th><th>vídeos</th><th>pedidos</th><th>custo US$</th><th></th></tr>` +
    us.map((u) => `<tr><td>${esc(u.email)}${u.admin ? ' · admin' : ''}</td><td>${u.admin ? '∞' : u.videos}</td><td>${u.pedidos}</td><td>${u.custo.toFixed(2)}</td>
      <td>${u.admin ? '' : `<input type="number" value="10" data-e="${esc(u.email)}"> <button data-e="${esc(u.email)}">creditar</button>`} <button data-s="${esc(u.email)}">link de senha</button></td></tr>`).join('') + '</table></div><p id="linkSenha" class="ok" style="word-break:break-all"></p><div id="pags"></div>';
  $('#admin').querySelectorAll('button[data-s]').forEach((b) => b.onclick = async () => {
    const r = await api('/api/admin/link-senha', { method:'POST', body: JSON.stringify({ email: b.dataset.s }) }); const d = await r.json();
    $('#linkSenha').textContent = r.ok ? `Mande pra ${b.dataset.s} (vale ${d.validade}): ${d.link}` : d.erro; });
  const pg = await (await api('/api/admin/pagamentos')).json(); const pend = Object.entries(pg.pendentes || {});
  $('#pags').innerHTML = `<small>Pagamentos Cakto (últimos 100)</small><div class="tabela"><table><tr><th>quando</th><th>e-mail</th><th>vídeos</th><th>situação</th></tr>` +
    (pg.pedidos.map((x) => `<tr><td>${esc((x.t || '').slice(0, 16).replace('T', ' '))}</td><td>${esc(x.email)}</td><td>${x.videos}</td><td>${esc(x.estornado ? ({ refund: 'reembolsado', chargeback: 'chargeback' }[x.estornado] || x.estornado) : x.obs || (x.conta || !(pg.pendentes || {})[x.email] ? 'creditado' : 'aguardando cadastro'))}</td></tr>`).join('') || '<tr><td colspan="4">nenhum ainda</td></tr>') + '</table></div>' +
    (pend.length ? `<small>Crédito esperando o cliente criar conta: ${pend.map(([e, n]) => esc(e) + ' (' + n + ')').join(', ')}</small>` : '');
  $('#admin').querySelectorAll('button[data-e]').forEach((b) => b.onclick = async () => {
    const n = $('#admin').querySelector(`input[data-e="${b.dataset.e}"]`).value;
    const r = await api('/api/admin/creditar', { method:'POST', body: JSON.stringify({ email: b.dataset.e, videos: Number(n) }) });
    if (!r.ok) alert((await r.json()).erro); painelAdmin();
  });
}

function midias(id, texto, { legenda = true, baixar = true, vistos = null } = {}) {
  const achados = [...new Set(texto.match(/job\/[\w.\-\/]+\.(mp4|mov|jpg|jpeg|png|webp)/gi) || [])].filter((p) => !vistos || !vistos.has(p));
  if (vistos) achados.forEach((p) => vistos.add(p));
  if (!achados.length) return '';
  return '<div class="midia">' + achados.map((p) => {
    const src = `/arquivos/${id}/${p}`, nome = p.split('/').pop();
    const el = /\.(mp4|mov)$/i.test(p) ? `<video src="${src}" controls playsinline preload="metadata" onerror="this.parentNode.remove()"></video>${baixar ? `<a class="baixar" href="${src}?baixar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg> Baixar</a>` : ''}`
                                       : `<a href="${src}" target="_blank"><img src="${src}" onerror="this.closest('figure').remove()"></a>`;
    return `<figure>${el}${legenda ? `<figcaption>${esc(nome)}</figcaption>` : ''}</figure>`;
  }).join('') + '</div>';
}

function job(id) {
  clearInterval(timer); jobAtual = id; ultimo = -1; mostraSaldo(); app.innerHTML = '<div id="chat"></div><div id="pens"></div>'; $('#compor').hidden = false; const vistos = new Set(); let concluido = false;
  let ferrs = null;
  const puxar = async () => {
    const r = await api(`/api/jobs/${id}/eventos?depois=${ultimo}`); if (!r.ok) { app.innerHTML = '<div class="aviso-erro" style="margin-left:0">Não achamos esse pedido. <a href="#">Voltar pro início</a></div>'; return clearInterval(timer); }
    const { status, custo, eventos } = await r.json(); const chat = $('#chat'); const embaixo = innerHeight + scrollY >= document.body.scrollHeight - 80;
    for (const e of eventos) {
      ultimo = e.n;
      if (e.tipo === 'ferramenta') {
        if (!detalhes()) continue;
        if (!ferrs) { ferrs = document.createElement('details'); ferrs.className = 'ferrs'; ferrs.innerHTML = '<summary>trabalhando…</summary>'; chat.append(ferrs); }
        if (ferrs.ultimo && eu.admin) ferrs.ultimo.insertAdjacentHTML('beforeend', ` <small>${((e.t - ferrs.ultimo.dataset.t) / 1000).toFixed(0)}s</small>`);
        ferrs.insertAdjacentHTML('beforeend', `<div class="ferr" data-t="${e.t}">${esc(eu.admin && e.detalhe ? e.detalhe : e.texto)}</div>`); ferrs.ultimo = ferrs.lastElementChild;
        ferrs.querySelector('summary').textContent = `${ferrs.children.length - 1} passos`;
        continue;
      }
      if (ferrs?.ultimo && eu.admin) ferrs.ultimo.insertAdjacentHTML('beforeend', ` <small>${((e.t - ferrs.ultimo.dataset.t) / 1000).toFixed(0)}s</small>`);
      ferrs = null;
      if (e.tipo === 'cliente') { const txt = e.texto.replace(/^Mandei o arquivo em \S+\.\s*/, '');
        chat.insertAdjacentHTML('beforeend', `<div class="msg cliente">${midias(id, e.texto.startsWith('Mandei o arquivo em ') ? e.texto.split(/\s/)[4] : '', { legenda: false, baixar: false })}${txt ? `<div>${esc(txt)}</div>` : ''}</div>`); }
      if (e.tipo === 'agente') chat.insertAdjacentHTML('beforeend', `<div class="msg agente">${LOGO}<div class="corpo">${md(semCaminho(e.texto))}${midias(id, e.texto, { vistos })}</div></div>`);
      if (e.tipo === 'fim' && e.custo != null && detalhes()) chat.insertAdjacentHTML('beforeend', `<div class="fim">admin · rodada ${e.dur ? (e.dur / 60000).toFixed(1) + ' min (modelo ' + (e.durModelo / 60000).toFixed(1) + ' · vídeo/ferramentas ' + ((e.dur - e.durModelo) / 60000).toFixed(1) + ') · ' + e.passos + ' passos · ' : ''}tokens acumulados US$ ${e.custo.toFixed(2)}</div>`);
      if (e.tipo === 'erro') chat.insertAdjacentHTML('beforeend', `<div class="aviso-erro">${esc(e.texto)}</div>`);
      if (e.tipo === 'aprovacao') chat.insertAdjacentHTML('beforeend', `<div class="aprov" id="ap-${esc(e.id)}"><p>${esc(e.resumo)}</p>
        <div class="uso"><span>Usa <b>${e.videos} vídeo${e.videos === 1 ? '' : 's'}</b> do seu saldo${eu.admin ? '' : ` · você tem <b>${eu.videos}</b>`}</span>${!eu.admin && eu.videos < e.videos && temPacotes ? '<a href="#/comprar">comprar vídeos</a>' : ''}</div>
        <div class="linha"><button data-ap="${esc(e.id)}">Aprovar e começar</button><small class="aperro erro"></small></div></div>`);
      if (e.tipo === 'aprovado') { const c = document.getElementById('ap-' + e.ref); if (c) c.outerHTML = `<div class="selo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Aprovado · ${e.videos} vídeo${e.videos === 1 ? '' : 's'} reservado${e.videos === 1 ? '' : 's'}</div>`; }
      if (e.tipo === 'entregue') { let g = chat.lastElementChild; if (!g?.classList.contains('entregas')) { g = document.createElement('div'); g.className = 'entregas'; chat.append(g); } g.insertAdjacentHTML('beforeend', `<div class="entrega"><div class="selo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> ${esc(e.caminho.split('/').pop().replace(/\.[^.]+$/, '').replace(/[-_]/g, ' '))}</div>${midias(id, e.caminho, { legenda: false, vistos })}</div>`); }
      if (e.tipo === 'finalizado') chat.insertAdjacentHTML('beforeend', `<p class="selo">Pedido concluído: ${e.entregues} vídeo${e.entregues === 1 ? '' : 's'} entregue${e.entregues === 1 ? '' : 's'}${e.devolvidos ? ` · ${e.devolvidos} devolvido${e.devolvidos === 1 ? '' : 's'} ao saldo` : ''}.</p>`);
    }
    $('#pens').innerHTML = status === 'rodando' ? '<div class="pensando"><span class="pontos"><i></i><i></i><i></i></span>trabalhando no seu vídeo</div>' : '';
    if (eventos.some((e) => e.tipo === 'finalizado')) concluido = true; else if (eventos.some((e) => e.tipo === 'aprovado' || e.tipo === 'cliente')) concluido = false;
    $('#st').textContent = (status !== 'rodando' && concluido ? 'concluído' : ESTADO[status]) + (custo != null && detalhes() ? ` · tokens US$ ${custo.toFixed(2)}` : '');
    $('#enviar').disabled = status === 'rodando';
    chat.querySelectorAll('button[data-ap]').forEach((b) => { b.disabled = status === 'rodando'; b.onclick = async () => {
      b.disabled = true; const r = await api(`/api/jobs/${id}/aprovar`, { method:'POST', body: JSON.stringify({ id: b.dataset.ap }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) { b.disabled = false; b.parentNode.querySelector('.aperro').textContent = d.erro || 'Não deu pra aprovar.'; }
      else if (d.videos != null) { eu.videos = d.videos; mostraSaldo(); } }; });
    if (eventos.some((e) => e.tipo === 'finalizado')) api('/api/eu').then((r) => r.json()).then((d) => { eu = d; mostraSaldo(); });
    if (eventos.length && embaixo) { scrollTo(0, document.body.scrollHeight);
      chat.querySelectorAll('video:not([data-r])').forEach((v) => { v.dataset.r = 1; v.addEventListener('loadedmetadata', () => { if (innerHeight + scrollY >= document.body.scrollHeight - 600) scrollTo(0, document.body.scrollHeight); }, { once: true }); }); }
  };
  puxar(); timer = setInterval(puxar, 1500);
}

$('#enviar').onclick = async () => {
  const t = $('#resp').value.trim(); if (!t || !jobAtual) return;
  $('#enviar').disabled = true; $('#resp').value = ''; $('#resp').style.height = 'auto';
  const r = await api(`/api/jobs/${jobAtual}/mensagem`, { method:'POST', body: JSON.stringify({ texto: t }) });
  if (!r.ok) { const d = await r.json().catch(() => ({})); $('#resp').value = t; alertaErro(d.erro || 'Não deu pra enviar.'); }
};
function alertaErro(t) { const p = document.createElement('p'); p.className = 'erro'; p.textContent = t; $('#chat')?.append(p); }
$('#resp').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#enviar').click(); } };
$('#resp').oninput = () => { const t = $('#resp'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; };
const rota = async () => {
  const ns = location.hash.match(/^#\/senha\/([\w-]+)$/); if (ns) return novaSenha(ns[1]);
  if (!eu) { try { eu = await (await api('/api/eu')).json(); } catch { return; } }
  const m = location.hash.match(/^#\/job\/(.+)$/); if (m) return job(m[1]);
  if (location.hash === '#/comprar') return comprar(); home();
};
$('#sair').onclick = async (e) => { e.preventDefault(); await fetch('/api/sair', { method:'POST' }); eu = null; mostraSaldo(); location.hash = ''; login(); };
addEventListener('hashchange', rota); rota();
</script>
