<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio Spy</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root { --bg:#0d0e10; --painel:#16181c; --borda:#262a31; --texto:#e8e9eb; --suave:#8b919c; --acento:#d4ff3a; --cliente:#1f2937; }
  * { box-sizing:border-box; } html,body { margin:0; background:var(--bg); color:var(--texto); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  a { color:var(--acento); } header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--borda); }
  header b { font-size:16px; letter-spacing:.2px; } header b i { color:var(--acento); font-style:normal; }
  header .st { margin-left:auto; color:var(--suave); font-size:13px; }
  main { max-width:860px; margin:0 auto; padding:20px 16px 160px; }
  .card { background:var(--painel); border:1px solid var(--borda); border-radius:14px; padding:20px; }
  h1 { font-size:26px; margin:28px 0 6px; } .sub { color:var(--suave); margin:0 0 22px; }
  .drop { border:1.5px dashed var(--borda); border-radius:12px; padding:28px; text-align:center; cursor:pointer; color:var(--suave); }
  .drop.ok { border-color:var(--acento); color:var(--texto); }
  input { width:100%; background:#0f1114; color:var(--texto); border:1px solid var(--borda); border-radius:10px; padding:12px; font:inherit; margin-top:10px; }
  textarea { width:100%; background:#0f1114; color:var(--texto); border:1px solid var(--borda); border-radius:10px; padding:12px; font:inherit; resize:vertical; min-height:80px; margin-top:14px; }
  button { background:var(--acento); color:#111; border:0; border-radius:10px; padding:11px 18px; font:600 15px system-ui; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; } .linha { display:flex; gap:10px; align-items:center; margin-top:12px; }
  .jobs { margin-top:26px; } .jobs a { display:block; padding:10px 0; border-top:1px solid var(--borda); text-decoration:none; color:var(--texto); }
  .jobs small { color:var(--suave); }
  .msg { margin:14px 0; } .msg.cliente { display:flex; flex-direction:column; align-items:flex-end; gap:6px; } .msg.cliente .midia video { max-width:260px; border-radius:12px; }
  .msg.cliente > div:not(.midia) { background:var(--cliente); border-radius:14px 14px 4px 14px; padding:10px 14px; max-width:80%; white-space:pre-wrap; }
  .msg.agente { background:var(--painel); border:1px solid var(--borda); border-radius:14px 14px 14px 4px; padding:4px 16px; }
  .msg.agente table { border-collapse:collapse; font-size:14px; } .msg.agente td,.msg.agente th { border:1px solid var(--borda); padding:5px 9px; }
  .msg.agente code { background:#0f1114; padding:1px 5px; border-radius:5px; font-size:13px; }
  .ferr { color:var(--suave); font-size:13px; margin:3px 0 3px 6px; } .ferr::before { content:"⚙ "; }
  .ferrs { margin:8px 0; } .ferrs summary { color:var(--suave); font-size:13px; cursor:pointer; }
  .midia { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 12px; }
  .midia video,.midia img { max-height:440px; max-width:100%; border-radius:10px; border:1px solid var(--borda); background:#000; }
  .midia figure { margin:0; } .midia figcaption { color:var(--suave); font-size:12px; margin-top:3px; }
  .fim { color:var(--suave); font-size:12px; text-align:center; margin:6px 0 16px; }
  .erro { color:#ff8080; }
  .aprov { border:1px solid var(--acento); border-radius:14px; padding:14px 16px; margin:14px 0; background:#14170c; }
  .aprov p { margin:0 0 10px; } .aprov small { color:var(--suave); } .ok { color:var(--acento); font-size:14px; margin:8px 0; }
  .admin { margin-top:30px; } .admin table { width:100%; border-collapse:collapse; font-size:14px; } .admin td,.admin th { border-top:1px solid var(--borda); padding:7px 4px; text-align:left; }
  .admin input { width:70px; margin:0; padding:6px; } .admin button { padding:6px 10px; font-size:13px; }
  .saldo { color:var(--acento); font-size:13px; }
  .termos { display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--suave); margin-top:12px; } .termos input { width:auto; margin:2px 0 0; }
  .pacotes { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:18px; }
  .pacote { display:flex; flex-direction:column; gap:6px; padding:18px; border:1px solid var(--borda); border-radius:14px; background:var(--painel); text-decoration:none; color:var(--texto); }
  .pacote:hover { border-color:var(--acento); } .pacote span { color:var(--acento); font-size:22px; font-weight:700; } .pacote small { color:var(--suave); }
  .compor { position:fixed; left:0; right:0; bottom:0; background:linear-gradient(transparent,var(--bg) 30%); padding:24px 16px 16px; }
  .compor .in { max-width:860px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
  .compor textarea { margin:0; min-height:52px; } .pensando { color:var(--suave); font-size:14px; margin:12px 4px; }
  .pensando::after { content:"…"; animation:p 1.2s infinite; } @keyframes p { 50% { opacity:.2; } }
</style>
</head>
<body>
<header><b>Estúdio <i>Spy</i></b><a href="#" style="font-size:13px" id="novo">novo pedido</a><span class="saldo" id="saldo"></span><a href="#/comprar" id="comprar" style="font-size:13px" hidden>comprar vídeos</a><span class="st" id="st"></span><a href="#" id="sair" style="font-size:13px" hidden>sair</a></header>
<main id="app"></main>
<div class="compor" id="compor" hidden><div class="in">
  <textarea id="resp" placeholder="Escreva sua mensagem"></textarea><button id="enviar">Enviar</button>
</div></div>
<script>
const $ = (s) => document.querySelector(s); const app = $('#app');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const md = (t) => DOMPurify.sanitize(marked.parse(t), { FORBID_TAGS: ['style','form','input','iframe','video','audio','img'], FORBID_ATTR: ['style'] });
let timer = null, ultimo = -1, jobAtual = null, eu = null;
// Admin vê o chat igual ao cliente; "detalhes" liga passos, tempos e custo (lembrado só neste navegador).
let temPacotes = false; fetch('/api/pacotes').then((r) => r.json()).then((d) => { temPacotes = d.pacotes.length > 0; mostraSaldo(); }).catch(() => {});
let det = false; try { det = localStorage.getItem('det') === '1'; } catch {}
const detalhes = () => !!(eu?.admin && det);
function mostraSaldo() {
  const s = $('#saldo'); if (!eu) { s.textContent = ''; $('#comprar').hidden = true; return; }
  $('#comprar').hidden = !!eu.admin || !temPacotes;
  if (!eu.admin) { s.textContent = `${eu.videos} vídeo${eu.videos === 1 ? '' : 's'} no saldo`; return; }
  s.innerHTML = `admin · <a href="#" id="det" style="font-size:13px">${det ? 'esconder detalhes' : 'ver detalhes'}</a>`;
  $('#det').onclick = (ev) => { ev.preventDefault(); det = !det; try { localStorage.setItem('det', det ? '1' : '0'); } catch {} if (jobAtual) job(jobAtual); else mostraSaldo(); };
}
async function api(url, op) { const r = await fetch(url, op); if (r.status === 401) { eu = null; login(); throw new Error('login'); } return r; }

function login() {
  clearInterval(timer); $('#compor').hidden = true; $('#st').textContent = ''; $('#sair').hidden = true;
  let criar = false;
  app.innerHTML = `<h1 id="lt">Entrar</h1><p class="sub" id="ls">Entre com o seu e-mail e senha.</p>
  <div class="card" style="max-width:420px"><input id="em" type="email" placeholder="e-mail" autocomplete="email">
  <input id="se" type="password" placeholder="senha" autocomplete="current-password">
  <label id="lt2" class="termos" hidden><input type="checkbox" id="aceito"> Li e aceito os <a href="/termos" target="_blank">termos de uso e a política de privacidade</a>.</label>
  <div class="linha"><button id="ent">Entrar</button><a href="#" id="troca" style="font-size:13px">criar conta</a><a href="#" id="esq" style="font-size:13px;margin-left:auto">esqueci a senha</a></div>
  <p id="lerro" class="erro" style="font-size:13px;margin:10px 0 0"></p></div>`;
  $('#esq').onclick = async (e) => { e.preventDefault(); const em = $('#em').value.trim();
    if (!em) return $('#lerro').textContent = 'Digite o seu e-mail acima e clique de novo em "esqueci a senha".';
    const r = await fetch('/api/esqueci', { method:'POST', body: JSON.stringify({ email: em }) }); const d = await r.json().catch(() => ({}));
    $('#lerro').className = r.ok ? 'ok' : 'erro'; $('#lerro').innerHTML = esc(d.msg || d.erro || 'Tente de novo.') + (d.suporte ? ` <a href="${esc(d.suporte)}" target="_blank">Falar com o suporte</a>` : ''); };
  $('#troca').onclick = (e) => { e.preventDefault(); criar = !criar; $('#lerro').textContent = '';
    $('#lt').textContent = criar ? 'Criar conta' : 'Entrar'; $('#ls').textContent = criar ? 'Senha com 8 ou mais caracteres.' : 'Entre com o seu e-mail e senha.';
    $('#ent').textContent = criar ? 'Criar conta' : 'Entrar'; $('#troca').textContent = criar ? 'já tenho conta' : 'criar conta';
    $('#se').autocomplete = criar ? 'new-password' : 'current-password'; $('#lt2').hidden = !criar; $('#esq').hidden = criar; };
  const ir = async () => {
    const r = await fetch(criar ? '/api/cadastrar' : '/api/entrar', { method:'POST', body: JSON.stringify({ email: $('#em').value, senha: $('#se').value, termos: criar ? $('#aceito').checked : undefined }) });
    const d = await r.json(); if (!r.ok) return $('#lerro').textContent = d.erro; eu = d; rota();
  };
  $('#ent').onclick = ir; $('#se').onkeydown = (e) => { if (e.key === 'Enter') ir(); };
}

function novaSenha(tok) {
  clearInterval(timer); $('#compor').hidden = true;
  app.innerHTML = `<h1>Senha nova</h1><p class="sub">Escolha uma senha com 8 ou mais caracteres.</p>
  <div class="card" style="max-width:420px"><input id="ns" type="password" placeholder="senha nova" autocomplete="new-password">
  <div class="linha"><button id="nsb">Salvar e entrar</button></div><p id="nse" class="erro" style="font-size:13px;margin:10px 0 0"></p></div>`;
  $('#nsb').onclick = async () => { const r = await fetch('/api/nova-senha', { method:'POST', body: JSON.stringify({ token: tok, senha: $('#ns').value }) });
    const d = await r.json().catch(() => ({})); if (!r.ok) return $('#nse').textContent = d.erro || 'Não deu certo.'; eu = d; location.hash = ''; };
}

async function comprar() {
  clearInterval(timer); jobAtual = null; $('#compor').hidden = true; mostraSaldo();
  const { pacotes, suporte } = await (await fetch('/api/pacotes')).json();
  app.innerHTML = `<h1>Comprar vídeos</h1><p class="sub">Cada vídeo do saldo = 1 variação pronta entregue. Se um pedido usar menos, a sobra volta pro saldo.</p>
  <p class="sub"><b>Importante:</b> no pagamento, use o mesmo e-mail da sua conta (${esc(eu.email)}). O saldo cai sozinho em até 1 minuto depois da aprovação.</p>
  <div class="pacotes">${pacotes.length ? pacotes.map((p) => `<a class="pacote" href="${esc(p.link)}" target="_blank" rel="noopener"><b>${esc(p.nome)}</b><span>${esc(p.preco)}</span><small>${p.videos} vídeos</small></a>`).join('')
    : '<p class="sub">Os pacotes ainda não estão disponíveis.</p>'}</div>
  ${suporte ? `<p class="sub" style="margin-top:20px">Dúvida ou problema com o pagamento? <a href="${esc(suporte)}" target="_blank">Fale com o suporte</a>.</p>` : ''}
  <p><a href="#">voltar</a></p>`;
}

function home() {
  clearInterval(timer); jobAtual = null; $('#compor').hidden = true; $('#st').textContent = eu.email; $('#sair').hidden = false; mostraSaldo();
  app.innerHTML = `<h1>Mande o criativo. Diga a variação.</h1>
  <p class="sub">Troca de avatar, headline, layout, clone com outra pessoa — do mesmo jeito que você pediria pra um editor.</p>
  <div class="card"><div class="drop" id="drop">Clique ou arraste o vídeo aqui</div><input type="file" id="arq" accept="video/*,image/*" hidden>
  <textarea id="msg" placeholder="Ex.: faz 3 variações desse trocando só o avatar por mulheres latinas"></textarea>
  <div class="linha"><button id="ir" disabled>Começar</button><span id="info" style="color:var(--suave);font-size:13px"></span></div></div>
  <div class="jobs" id="jobs"></div><div class="admin" id="admin"></div>`;
  if (eu.admin) painelAdmin();
  if (!eu.admin && eu.videos < 1) { $('#drop').textContent = 'Você ainda não tem vídeos no saldo. Fale com quem te passou o acesso.'; $('#drop').style.pointerEvents = 'none'; $('#msg').disabled = true; }
  let arquivo = null; const drop = $('#drop'), arq = $('#arq');
  const pega = (f) => { arquivo = f; drop.textContent = f.name + ' · ' + (f.size/1e6).toFixed(1) + ' MB'; drop.classList.add('ok'); $('#ir').disabled = false; };
  drop.onclick = () => arq.click(); arq.onchange = () => arq.files[0] && pega(arq.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); }; drop.ondrop = (e) => { e.preventDefault(); e.dataTransfer.files[0] && pega(e.dataTransfer.files[0]); };
  $('#ir').onclick = async () => {
    $('#ir').disabled = true; $('#info').textContent = 'enviando…';
    const r = await api(`/api/jobs?nome=${encodeURIComponent(arquivo.name)}&msg=${encodeURIComponent($('#msg').value)}`, { method:'POST', body: arquivo });
    const d = await r.json(); if (!r.ok) { $('#info').textContent = d.erro || 'Não deu pra enviar.'; $('#ir').disabled = false; return; }
    location.hash = '#/job/' + d.id;
  };
  api('/api/jobs').then((r) => r.json()).then((js) => { if (js.length) $('#jobs').innerHTML = '<small>Seus pedidos</small>' +
    js.map((j) => `<a href="#/job/${j.id}">${esc(j.primeira || 'pedido ' + j.id)}<br><small>${{ rodando:'trabalhando', esperando:'esperando você', erro:'erro', novo:'começando' }[j.status]}${j.custo != null ? ' · tokens US$ ' + j.custo.toFixed(2) : ''}</small></a>`).join(''); });
}

async function painelAdmin() {
  const us = await (await api('/api/admin/usuarios')).json();
  $('#admin').innerHTML = `<small>Clientes (admin)</small><table><tr><th>e-mail</th><th>vídeos</th><th>pedidos</th><th>custo US$</th><th></th></tr>` +
    us.map((u) => `<tr><td>${esc(u.email)}${u.admin ? ' · admin' : ''}</td><td>${u.admin ? '∞' : u.videos}</td><td>${u.pedidos}</td><td>${u.custo.toFixed(2)}</td>
      <td>${u.admin ? '' : `<input type="number" value="10" data-e="${esc(u.email)}"> <button data-e="${esc(u.email)}">creditar</button>`} <button data-s="${esc(u.email)}">link de senha</button></td></tr>`).join('') + '</table><p id="linkSenha" class="ok"></p><div id="pags"></div>';
  $('#admin').querySelectorAll('button[data-s]').forEach((b) => b.onclick = async () => {
    const r = await api('/api/admin/link-senha', { method:'POST', body: JSON.stringify({ email: b.dataset.s }) }); const d = await r.json();
    $('#linkSenha').textContent = r.ok ? `Mande pra ${b.dataset.s} (vale ${d.validade}): ${d.link}` : d.erro; });
  const pg = await (await api('/api/admin/pagamentos')).json(); const pend = Object.entries(pg.pendentes || {});
  $('#pags').innerHTML = `<small>Pagamentos Cakto (últimos 100)</small><table><tr><th>quando</th><th>e-mail</th><th>vídeos</th><th>situação</th></tr>` +
    (pg.pedidos.map((x) => `<tr><td>${esc((x.t || '').slice(0, 16).replace('T', ' '))}</td><td>${esc(x.email)}</td><td>${x.videos}</td><td>${esc(x.estornado ? ({ refund: 'reembolsado', chargeback: 'chargeback' }[x.estornado] || x.estornado) : x.obs || (x.conta || !(pg.pendentes || {})[x.email] ? 'creditado' : 'aguardando cadastro'))}</td></tr>`).join('') || '<tr><td colspan="4">nenhum ainda</td></tr>') + '</table>' +
    (pend.length ? `<small>Crédito esperando o cliente criar conta: ${pend.map(([e, n]) => esc(e) + ' (' + n + ')').join(', ')}</small>` : '');
  $('#admin').querySelectorAll('button[data-e]').forEach((b) => b.onclick = async () => {
    const n = $('#admin').querySelector(`input[data-e="${b.dataset.e}"]`).value;
    const r = await api('/api/admin/creditar', { method:'POST', body: JSON.stringify({ email: b.dataset.e, videos: Number(n) }) });
    if (!r.ok) alert((await r.json()).erro); painelAdmin();
  });
}

function midias(id, texto, { legenda = true, baixar = true } = {}) {
  const achados = [...new Set(texto.match(/job\/[\w.\-\/]+\.(mp4|mov|jpg|jpeg|png|webp)/gi) || [])];
  if (!achados.length) return '';
  return '<div class="midia">' + achados.map((p) => {
    const src = `/arquivos/${id}/${p}`, nome = p.split('/').pop();
    const el = /\.(mp4|mov)$/i.test(p) ? `<video src="${src}" controls playsinline preload="metadata" onerror="this.parentNode.remove()"></video>${baixar ? `<a href="${src}?baixar" style="font-size:12px">baixar</a> ` : ''}`
                                       : `<a href="${src}" target="_blank"><img src="${src}" onerror="this.closest('figure').remove()"></a>`;
    return `<figure>${el}${legenda ? `<figcaption>${esc(nome)}</figcaption>` : ''}</figure>`;
  }).join('') + '</div>';
}

function job(id) {
  clearInterval(timer); jobAtual = id; ultimo = -1; mostraSaldo(); app.innerHTML = '<div id="chat"></div><div id="pens"></div>'; $('#compor').hidden = false;
  let ferrs = null;
  const puxar = async () => {
    const r = await api(`/api/jobs/${id}/eventos?depois=${ultimo}`); if (!r.ok) { app.innerHTML = '<p class="erro">Pedido não encontrado (o servidor reiniciou?).</p>'; return clearInterval(timer); }
    const { status, custo, eventos } = await r.json(); const chat = $('#chat'); const embaixo = innerHeight + scrollY >= document.body.scrollHeight - 80;
    for (const e of eventos) {
      ultimo = e.n;
      if (e.tipo === 'ferramenta') {
        if (!detalhes()) continue;
        if (!ferrs) { ferrs = document.createElement('details'); ferrs.className = 'ferrs'; ferrs.innerHTML = '<summary>trabalhando…</summary>'; chat.append(ferrs); }
        if (ferrs.ultimo && eu.admin) ferrs.ultimo.insertAdjacentHTML('beforeend', ` <small>${((e.t - ferrs.ultimo.dataset.t) / 1000).toFixed(0)}s</small>`);
        ferrs.insertAdjacentHTML('beforeend', `<div class="ferr" data-t="${e.t}">${esc(eu.admin && e.detalhe ? e.detalhe : e.texto)}</div>`); ferrs.ultimo = ferrs.lastElementChild;
        ferrs.querySelector('summary').textContent = `${ferrs.children.length - 1} passos`;
        continue;
      }
      if (ferrs?.ultimo && eu.admin) ferrs.ultimo.insertAdjacentHTML('beforeend', ` <small>${((e.t - ferrs.ultimo.dataset.t) / 1000).toFixed(0)}s</small>`);
      ferrs = null;
      if (e.tipo === 'cliente') { const txt = e.texto.replace(/^Mandei o arquivo em \S+\.\s*/, '');
        chat.insertAdjacentHTML('beforeend', `<div class="msg cliente">${midias(id, e.texto.startsWith('Mandei o arquivo em ') ? e.texto.split(/\s/)[4] : '', { legenda: false, baixar: false })}${txt ? `<div>${esc(txt)}</div>` : ''}</div>`); }
      if (e.tipo === 'agente') chat.insertAdjacentHTML('beforeend', `<div class="msg agente">${md(e.texto)}${midias(id, e.texto)}</div>`);
      if (e.tipo === 'fim' && e.custo != null && detalhes()) chat.insertAdjacentHTML('beforeend', `<div class="fim">admin · rodada ${e.dur ? (e.dur / 60000).toFixed(1) + ' min (modelo ' + (e.durModelo / 60000).toFixed(1) + ' · vídeo/ferramentas ' + ((e.dur - e.durModelo) / 60000).toFixed(1) + ') · ' + e.passos + ' passos · ' : ''}tokens acumulados US$ ${e.custo.toFixed(2)}</div>`);
      if (e.tipo === 'erro') chat.insertAdjacentHTML('beforeend', `<p class="erro">${esc(e.texto)}</p>`);
      if (e.tipo === 'aprovacao') chat.insertAdjacentHTML('beforeend', `<div class="aprov" id="ap-${esc(e.id)}"><p>${esc(e.resumo)}</p>
        <p><b>Usa ${e.videos} vídeo${e.videos === 1 ? '' : 's'} do seu saldo.</b> <small>${eu.admin ? '' : `Você tem ${eu.videos}.`}</small>${!eu.admin && eu.videos < e.videos && temPacotes ? ' <a href="#/comprar">comprar vídeos</a>' : ''}</p>
        <button data-ap="${esc(e.id)}">Aprovar</button> <small class="aperro"></small></div>`);
      if (e.tipo === 'aprovado') { const c = document.getElementById('ap-' + e.ref); if (c) c.innerHTML = `<p class="ok">✓ Aprovado · ${e.videos} vídeo${e.videos === 1 ? '' : 's'} reservado${e.videos === 1 ? '' : 's'}</p>`; }
      if (e.tipo === 'entregue') chat.insertAdjacentHTML('beforeend', `<p class="ok">✓ Entregue: ${esc(e.caminho.split('/').pop())}</p>${midias(id, e.caminho)}`);
      if (e.tipo === 'finalizado') chat.insertAdjacentHTML('beforeend', `<p class="ok">Pedido concluído: ${e.entregues} vídeo${e.entregues === 1 ? '' : 's'} entregue${e.entregues === 1 ? '' : 's'}${e.devolvidos ? ` · ${e.devolvidos} devolvido${e.devolvidos === 1 ? '' : 's'} ao saldo` : ''}.</p>`);
    }
    $('#pens').innerHTML = status === 'rodando' ? '<div class="pensando">trabalhando no seu vídeo</div>' : '';
    $('#st').textContent = { rodando:'trabalhando', esperando:'esperando você', erro:'erro', novo:'começando' }[status] + (custo != null && detalhes() ? ` · tokens US$ ${custo.toFixed(2)}` : '');
    $('#enviar').disabled = status === 'rodando';
    chat.querySelectorAll('button[data-ap]').forEach((b) => { b.disabled = status === 'rodando'; b.onclick = async () => {
      b.disabled = true; const r = await api(`/api/jobs/${id}/aprovar`, { method:'POST', body: JSON.stringify({ id: b.dataset.ap }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) { b.disabled = false; b.parentNode.querySelector('.aperro').textContent = d.erro || 'Não deu pra aprovar.'; }
      else if (d.videos != null) { eu.videos = d.videos; mostraSaldo(); } }; });
    if (eventos.some((e) => e.tipo === 'finalizado')) api('/api/eu').then((r) => r.json()).then((d) => { eu = d; mostraSaldo(); });
    if (eventos.length && embaixo) scrollTo(0, document.body.scrollHeight);
  };
  puxar(); timer = setInterval(puxar, 1500);
}

$('#enviar').onclick = async () => {
  const t = $('#resp').value.trim(); if (!t || !jobAtual) return;
  $('#enviar').disabled = true; $('#resp').value = '';
  const r = await api(`/api/jobs/${jobAtual}/mensagem`, { method:'POST', body: JSON.stringify({ texto: t }) });
  if (!r.ok) { const d = await r.json().catch(() => ({})); $('#resp').value = t; alertaErro(d.erro || 'Não deu pra enviar.'); }
};
function alertaErro(t) { const p = document.createElement('p'); p.className = 'erro'; p.textContent = t; $('#chat')?.append(p); }
$('#resp').onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('#enviar').click(); };
const rota = async () => {
  const ns = location.hash.match(/^#\/senha\/([\w-]+)$/); if (ns) return novaSenha(ns[1]);
  if (!eu) { try { eu = await (await api('/api/eu')).json(); } catch { return; } }
  const m = location.hash.match(/^#\/job\/(.+)$/); if (m) return job(m[1]);
  if (location.hash === '#/comprar') return comprar(); home();
};
$('#sair').onclick = async (e) => { e.preventDefault(); await fetch('/api/sair', { method:'POST' }); eu = null; mostraSaldo(); location.hash = ''; login(); };
addEventListener('hashchange', rota); rota();
</script>
